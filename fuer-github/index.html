<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vermögen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1116'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Layout: fixed sidebar (desktop) / bottom tabs (phone); content column max 1180px; cards only for charts & lists. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --line:#e2e5ea; --line-2:#d3d7de;
  --ink:#0e1116; --ink-2:#4a5160; --ink-3:#7a8290; --btn:#0e1116; --btn-ink:#ffffff;
  --pos:#12784a; --pos-bg:#e3f4ea; --neg:#b9352c; --neg-bg:#fbe7e5; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --focus:#2a78d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#8b919c;
  --f-ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(14,17,22,.04), 0 4px 16px rgba(14,17,22,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0e11; --surface:#14171c; --surface-2:#1b1f25; --line:#252a32; --line-2:#323843;
  --ink:#eef0f3; --ink-2:#a8afba; --ink-3:#747c89; --btn:#eef0f3; --btn-ink:#0e1116;
  --pos:#4cc38a; --pos-bg:#12291e; --neg:#f07a70; --neg-bg:#331816; --warn:#e8b14a; --warn-bg:#2e2410;
  --focus:#5598e7;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#6f7682;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0e11; --surface:#14171c; --surface-2:#1b1f25; --line:#252a32; --line-2:#323843;
  --ink:#eef0f3; --ink-2:#a8afba; --ink-3:#747c89; --btn:#eef0f3; --btn-ink:#0e1116;
  --pos:#4cc38a; --pos-bg:#12291e; --neg:#f07a70; --neg-bg:#331816; --warn:#e8b14a; --warn-bg:#2e2410;
  --focus:#5598e7;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#0ca30c; --c7:#9085e9; --c8:#e66767; --c9:#6f7682;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01"}
.num,td.n,th.n,input.n{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand svg{flex:none}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:10px}
.status{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-3);line-height:1.4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:5px;flex:none}
.dot.ok{background:var(--pos)} .dot.warn{background:var(--warn)}
.theme-btn{justify-self:start;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--ink-2);cursor:pointer}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.tabbar{display:none}

/* type */
h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;font-weight:650;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
.eyebrow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--ink-2)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.input,select.input{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
.input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.pos{background:var(--pos-bg);color:var(--pos)} .chip.neg{background:var(--neg-bg);color:var(--neg)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0;flex-wrap:wrap}
.card-b{padding:16px 18px 18px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.hero-total{font-size:clamp(34px,5.4vw,52px);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin:6px 0 10px}
.hero-total .cents{color:var(--ink-3);font-weight:500}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.kpi{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px;margin-top:1px}

/* chart */
.chart{position:relative;width:100%;height:300px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--ink-3);font-size:11px;font-family:var(--f-ui)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.12);min-width:170px;z-index:5}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.sw{width:9px;height:9px;border-radius:3px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);padding:0 18px 16px}
.legend button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:inherit;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.4}

/* allocation */
.alloc-bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin-bottom:14px}
.alloc-bar span{display:block;height:100%}
.alloc-list{display:grid}
.alloc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.alloc-row:first-child{border-top:0}
.alloc-row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-row .val{text-align:right;font-weight:500}
.alloc-row .meta{grid-column:2/4;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.share{display:inline-block;min-width:44px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
td.n,th.n{text-align:right}
tr.cat td{font-weight:600;background:var(--surface-2)}
tr.cat td:first-child{display:flex;align-items:center;gap:8px}
tr.total td{font-weight:650;border-top:1px solid var(--line-2);border-bottom:0}
tr.acc td:first-child{padding-left:30px;color:var(--ink-2)}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.matrix tr.cat td:first-child{background:var(--surface-2)}
.matrix th .hd{display:grid;gap:3px;justify-items:end}
.toggle{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.toggle svg{width:14px;height:14px;transition:transform .15s}
.toggle[aria-expanded="true"] svg{transform:rotate(90deg)}

/* positions */
.pos-list{display:grid}
.pos-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.pos-row:first-child{border-top:0}
.pos-row .nm{font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.pos-row .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-row .sub2{font-size:12px;color:var(--ink-3)}
.pos-row .r{text-align:right}

/* valuation form */
.val-head{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;align-items:end}
.val-group{overflow:hidden}
.val-group .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;cursor:pointer;user-select:none}
.val-group .gh .l{display:flex;align-items:center;gap:10px;font-weight:600}
.val-group .gh .r{display:flex;align-items:center;gap:12px}
.vrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(90px,.7fr) minmax(150px,1fr) minmax(90px,.6fr);gap:12px;align-items:center;padding:8px 18px;border-top:1px solid var(--line)}
.vrow .nm{min-width:0}
.vrow .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .nm small{color:var(--ink-3);font-size:12px}
.vrow .prev{text-align:right;color:var(--ink-3)}
.vrow .delta{text-align:right;font-size:13px}
.vrow input.n{text-align:right}
.live-calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.live-calc .x{font-size:12px;color:var(--ink-3);white-space:nowrap;text-align:right}
.vrow-h{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding-top:4px;padding-bottom:4px}
.savebar{position:sticky;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.10)}
.savebar .tot{font-size:20px;font-weight:600;letter-spacing:-.02em}
.msg{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.msg.info{background:var(--surface-2);color:var(--ink-2)}

/* accounts */
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer}
.acc-row:hover{background:var(--surface-2)}
.acc-row.arch{opacity:.55}
.acc-row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* dialog */
dialog{border:1px solid var(--line-2);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,12,15,.45)}
.dlg-h{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:16px 20px;display:grid;gap:14px}
.dlg-f{padding:0 20px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dlg-f .r{display:flex;gap:8px;margin-left:auto}
.results{border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto}
.results button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 11px;cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover{background:var(--surface-2)}
.results small{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-weight:500;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.spark{display:block}
.hint{font-size:12.5px;color:var(--ink-3)}

@media (max-width: 980px){
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:18px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px, env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-right,0px));justify-content:space-around}
  .tabbar a{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);text-decoration:none;padding:4px 6px;border-radius:8px}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  .tabbar svg{width:20px;height:20px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .chart{height:240px}
  .val-head{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:minmax(0,1fr) minmax(130px,1fr);padding:10px 14px}
  .vrow .prev,.vrow .delta{display:none}
  .vrow-h{display:none}
  .acc-row{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .acc-row .hide-sm{display:none}
  .savebar{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigation">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M7 22l6-7 5 4 7-9" stroke="var(--surface)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Vermögen
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="status"><span class="dot" id="st-store-dot"></span><span id="st-store">Verbinde …</span></div>
      <div class="status"><span class="dot" id="st-live-dot"></span><span id="st-live">Live-Kurse: noch nicht geladen</span></div>
      <button class="theme-btn" id="theme-btn" type="button">Design: System</button>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
</div>
<dialog id="dlg"></dialog>
<input type="file" id="file-in" accept="application/json,.json" hidden>

<script>
"use strict";
/* ============ Helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const LOCALE = "de-AT";
const fmtE = new Intl.NumberFormat(LOCALE, {style: "currency", currency: "EUR"});
const fmtE0 = new Intl.NumberFormat(LOCALE, {style: "currency", currency: "EUR", maximumFractionDigits: 0});
const fmtN = new Intl.NumberFormat("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtQ = new Intl.NumberFormat("de-DE", {maximumFractionDigits: 8});
const fmtP = new Intl.NumberFormat(LOCALE, {style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: "exceptZero"});
const fmtPs = new Intl.NumberFormat(LOCALE, {style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1});
const eur = v => fmtE.format(v || 0);
const eur0 = v => fmtE0.format(v || 0);
const sEur = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmtE.format(Math.abs(v || 0)).replace("-", "");
const sEur0 = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmtE0.format(Math.abs(v || 0)).replace("-", "");
const pct = v => isFinite(v) ? fmtP.format(v).replace("-", "−") : "–";
const cls = v => v > 0.004 ? "pos" : v < -0.004 ? "neg" : "";
const compact = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toLocaleString(LOCALE, {maximumFractionDigits: 1}) + " Mio";
  if (a >= 1e3) return (v / 1e3).toLocaleString(LOCALE, {maximumFractionDigits: 0}) + " Tsd";
  return v.toLocaleString(LOCALE, {maximumFractionDigits: 0});
};
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => parseD(s).toLocaleDateString(LOCALE, {day: "2-digit", month: "2-digit", year: "numeric"});
const fmtDateL = s => parseD(s).toLocaleDateString(LOCALE, {day: "numeric", month: "long", year: "numeric"});
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

    try { const j = await getJSON(RELAYS[i](url)); if (i !== relayFirst) { relayFirst = i; store.set("relay", i); } return j; }
    catch (e) { last = e; }

  let f = 1, c = ccy;
  if (ccy === "GBp" || ccy === "GBX") { f = 0.01; c = "GBP"; }
  if (ccy === "ZAc") { f = 0.01; c = "ZAR"; }
  if (ccy === "ILA") { f = 0.01; c = "ILS"; }
  if (!FX[c]) { const j = await viaRelay(`https://query1.finance.yahoo.com/v8/finance/chart/EUR${c.toUpperCase()}=X?range=1d&interval=1d`); FX[c] = j.chart.result[0].meta.regularMarketPrice; }

const MARKET = {
  async quotes(stocks, crypto) {
    if (MODE === "server") {
      const r = await fetch(`api/quotes?stocks=${encodeURIComponent(stocks.join(","))}&crypto=${encodeURIComponent(crypto.join(","))}`, {cache: "no-store"});
      return await r.json();
    }
    const quotes = {}, errors = {};
    const jobs = stocks.map(async sym => {
      try {
        const j = await viaRelay(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=5d&interval=1d`);
        const m = j.chart.result[0].meta;
        quotes["stock:" + sym] = {symbol: sym, name: m.longName || m.shortName || sym, price: m.regularMarketPrice, currency: m.currency || "EUR",
          priceEur: m.regularMarketPrice * await fxToEur(m.currency), time: m.regularMarketTime, source: "Yahoo Finance"};
      } catch (e) { errors["stock:" + sym] = "Kein Kurs gefunden"; }
    });
    if (crypto.length) jobs.push((async () => {
      try {

        crypto.forEach(c => j[c]?.eur != null ? quotes["crypto:" + c] = {symbol: c, priceEur: j[c].eur, currency: "EUR", source: "CoinGecko", time: j[c].last_updated_at} : errors["crypto:" + c] = "Unbekannte CoinGecko-ID");
      } catch { crypto.forEach(c => errors["crypto:" + c] = "CoinGecko nicht erreichbar"); }

let QUOTES = {};   // key -> {priceEur, currency, price, name, time, source}
let QERR = {};

let quoteBusy = false;
async function refreshQuotes(silent) {
  const live = DB.accounts.filter(a => isLive(a) && !a.archived);
  if (!live.length) { setLiveStatus(); return; }
  if (quoteBusy) return; quoteBusy = true; setLiveStatus("lädt");
  const stocks = [...new Set(live.filter(a => a.kind === "stock").map(a => a.symbol))];
  const crypto = [...new Set(live.filter(a => a.kind === "crypto").map(a => a.symbol))];
  QERR = {};
  try {
    const j = await MARKET.quotes(stocks, crypto);
    Object.assign(QUOTES, j.quotes || {}); QERR = j.errors || {};
    if (!Object.keys(j.quotes || {}).length) throw new Error("none");
    quotesAt = new Date();
    DB.lastQuotes = {...DB.lastQuotes, ...Object.fromEntries(Object.entries(QUOTES).map(([k, q]) => [k, {priceEur: q.priceEur, at: quotesAt.toISOString()}]))};
    save();
  } catch (e) {
    QERR._ = "Keine Verbindung zu den Kursquellen";
    quoteBusy = false; setLiveStatus();
    if (!silent) toast("Kurse konnten nicht geladen werden. Besteht eine Internetverbindung?");
    return;
  }

  if (!silent) toast(Object.keys(QERR).length ? "Kurse teilweise aktualisiert" : "Kurse aktualisiert");

}

  const lq = DB.lastQuotes?.[quoteKey(a)];
  if (lq) return {price: lq.priceEur, fresh: false, at: lq.at};
  const sq = [...DB.snapshots].reverse().find(s => s.quotes?.[a.id]?.price);
  if (sq) return {price: sq.quotes[a.id].price, fresh: false, at: sq.date};

}

  const n = DB.accounts.filter(a => isLive(a) && !a.archived).length;
  if (!n) { dot.className = "dot"; t.textContent = "Keine Positionen mit Live-Kurs"; return; }

function liveEstimate() {
  const s = latest(); if (!s) return null;
  const values = {...s.values}; let changed = 0;
  DB.accounts.filter(a => isLive(a) && !a.archived && a.qty != null).forEach(a => {

function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / count, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;

  return t;
}

  const t = []; let d = new Date(x0.getFullYear(), Math.ceil(x0.getMonth() / stepM) * stepM, 1);

function sparkline(values, color, w = 84, h = 26) {
  const v = values.filter(x => x != null); if (v.length < 2) return `<svg width="${w}" height="${h}" class="spark"></svg>`;
  const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
  const pts = v.map((x, i) => [(i / (v.length - 1)) * (w - 4) + 2, h - 3 - ((x - mn) / r) * (h - 6)]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("")}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.4" fill="${color}"/></svg>`;
}

  if (!S.length) { v.innerHTML = `<div class="head"><h1>Verlauf</h1></div><div class="card empty">Noch keine Bewertungen. <a href="#bewertung">Erste Bewertung erfassen</a></div>`; return; }
  const expanded = new Set(store.get("hist-open", []));
  v.innerHTML = `<div class="head"><div><h1>Verlauf</h1><p>${S.length} Bewertungen von ${fmtDate(S.at(-1).date)} bis ${fmtDate(S[0].date)}. Klicke auf eine Kategorie für die einzelnen Konten.</p></div>
    <button class="btn" type="button" id="h-csv">${I.dl} Als CSV exportieren</button></div>
    <div class="card"><div class="tbl-wrap"><table class="matrix" id="mx"></table></div></div>`;
  const ctAll = S.map(catTotals);
  const render = () => {
    let h = `<thead><tr><th>Kategorie / Konto</th>${S.map(s => `<th class="n"><div class="hd"><span>${fmtDate(s.date)}</span><button class="btn ghost sm" type="button" data-edit="${s.id}" aria-label="Bewertung ${fmtDate(s.date)} bearbeiten" title="${esc(s.note || "Bearbeiten")}">${I.edit}</button></div></th>`).join("")}</tr></thead><tbody>`;
    DB.categories.forEach(c => {
      const accs = DB.accounts.filter(a => a.cat === c.key && S.some(s => s.values[a.id]));
      if (!accs.length && !ctAll.some(t => t[c.key])) return;
      const ex = expanded.has(c.key);
      h += `<tr class="cat"><td><button class="toggle" type="button" data-cat="${c.key}" aria-expanded="${ex}">${I.chev}<i class="sw" style="background:${catColor(c.key)}"></i>${esc(c.label)}</button></td>${ctAll.map(t => `<td class="n">${eur0(t[c.key])}</td>`).join("")}</tr>`;
      if (ex) accs.forEach(a => h += `<tr class="acc"><td title="${esc(a.name)}">${esc(a.name)}</td>${S.map(s => `<td class="n">${s.values[a.id] != null ? eur(s.values[a.id]) : '<span class="muted">–</span>'}</td>`).join("")}</tr>`);
    });
    h += `<tr class="total"><td>Nettovermögen</td>${S.map(s => `<td class="n">${eur0(total(s))}</td>`).join("")}</tr>`;
    h += `<tr><td class="muted">Veränderung</td>${S.map((s, i) => { const p = S[i + 1]; if (!p) return '<td class="n muted">–</td>'; const d = total(s) - total(p); return `<td class="n ${cls(d)}">${sEur0(d)}<br><small>${pct(total(s) / total(p) - 1)}</small></td>`; }).join("")}</tr></tbody>`;
    $("#mx").innerHTML = h;
    $$("#mx [data-cat]").forEach(b => b.onclick = () => { const k = b.dataset.cat; expanded.has(k) ? expanded.delete(k) : expanded.add(k); store.set("hist-open", [...expanded]); render(); });
    $$("#mx [data-edit]").forEach(b => b.onclick = () => { editId = b.dataset.edit; location.hash = "#bewertung"; if (route === "bewertung") go(); });
  };
  render();
  $("#h-csv").onclick = () => {
    const A = snaps();
    const n = x => x == null ? "" : String(round2(x)).replace(".", ",");
    const rows = [["Kategorie", "Konto", ...A.map(s => s.date)]];
    DB.categories.forEach(c => {
      rows.push([c.label, "Summe", ...A.map(s => n(catTotals(s)[c.key]))]);
      DB.accounts.filter(a => a.cat === c.key).forEach(a => rows.push([c.label, a.name, ...A.map(s => n(s.values[a.id]))]));
    });
    rows.push(["Gesamt", "Nettovermögen", ...A.map(s => n(total(s)))]);
    const csv = "﻿" + rows.map(r => r.map(x => /[;"\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x).join(";")).join("\r\n");
    download(`vermoegen-verlauf-${todayISO()}.csv`, csv, "text/csv");
  };
}

/* ============ View: Konten ============ */
function viewAccounts(v) {
  resizeFns = [];
  const L = latest();
  v.innerHTML = `<div class="head"><div><h1>Konten</h1><p>Lege fest, welche Konten du bewertest. Bei Wertpapieren und Krypto genügt die Stückzahl: der Kurs kommt automatisch.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="k-cat">Kategorien bearbeiten</button><button class="btn primary" type="button" id="k-add">${I.plus} Konto hinzufügen</button></div></div>
    <div class="seg" id="k-filter"><button type="button" data-v="active">Aktiv</button><button type="button" data-v="all">Alle inkl. archiviert</button></div>
    <div id="k-list" style="display:grid;gap:14px"></div>`;
  let filter = store.get("k-filter", "active");
  const render = () => {
    $$("#k-filter button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === filter));
    $("#k-list").innerHTML = DB.categories.map(c => {
      const list = DB.accounts.filter(a => a.cat === c.key && (filter === "all" || !a.archived));
      if (!list.length) return "";
      const sum = list.reduce((x, a) => x + (L?.values[a.id] || 0), 0);
      return `<div class="card" style="overflow:hidden"><div class="gh" style="display:flex;justify-content:space-between;padding:13px 18px;font-weight:600"><span style="display:flex;gap:10px;align-items:center"><i class="sw" style="background:${catColor(c.key)}"></i>${esc(c.label)}</span><span class="num">${eur(sum)}</span></div>
        ${list.map(a => {
          const p = isLive(a) ? priceOf(a) : null;
          return `<div class="acc-row ${a.archived ? "arch" : ""}" data-id="${a.id}" role="button" tabindex="0" aria-label="${esc(a.name)} bearbeiten">
            <span class="nm">${esc(a.name)}</span>
            <span class="hide-sm">${isLive(a) ? `<span class="chip live ${p?.fresh ? "pos" : ""}">${esc(a.symbol)}${a.qty != null ? " · " + fmtQ.format(a.qty) + " Stk." : ""}</span>` : a.archived ? '<span class="chip">archiviert</span>' : '<span class="chip">manuell</span>'}</span>
            <span class="hide-sm muted num">${p ? fmtN.format(p.price) + " €" : ""}</span>
            <span class="num">${L?.values[a.id] != null ? eur(L.values[a.id]) : "–"}</span></div>`;
        }).join("")}</div>`;
    }).join("") || '<div class="card empty">Noch keine Konten.</div>';
    $$(".acc-row").forEach(r => { const f = () => accountDialog(accById(r.dataset.id), render); r.onclick = f; r.onkeydown = e => { if (e.key === "Enter") f(); }; });
  };
  $$("#k-filter button").forEach(b => b.onclick = () => { filter = b.dataset.v; store.set("k-filter", filter); render(); });
  $("#k-add").onclick = () => accountDialog(null, render);
  $("#k-cat").onclick = () => categoryDialog(render);
  render(); onQuotes = render;
}

/* ============ View: Daten ============ */
function viewData(v) {
  resizeFns = [];
  v.innerHTML = `<div class="head"><div><h1>Daten</h1><p>Sichere deine Daten regelmäßig. ${MODE === "server" ? "Der Server legt zusätzlich jeden Tag automatisch eine Sicherung im Ordner „backups“ an." : ""}</p></div></div>
    <div class="grid-2">
      <div class="card"><div class="card-h"><h2>Speicherort</h2></div><div class="card-b" style="display:grid;gap:10px">
        ${MODE === "server" ? `<p style="margin:0">Alle Daten liegen in der Datei <b>data.json</b> im Programmordner auf deinem Computer. Nichts wird in eine Cloud geladen. Die App fragt nur Kurse bei Yahoo Finance und CoinGecko ab.</p>`
          : `<p style="margin:0">Deine Daten liegen nur in diesem Browser auf diesem Gerät. Sie werden nirgends hochgeladen, auch nicht zu GitHub. Die App fragt nur Kurse bei Yahoo Finance und CoinGecko ab.</p>
             <div class="msg">Wenn du die Browserdaten löschst, sind auch deine Bewertungen weg. Lade deshalb regelmäßig ein Backup herunter. Mit dem Backup kannst du die Daten auch auf einem anderen Gerät importieren.</div>`}
        <p class="muted" style="margin:0">${DB.accounts.length} Konten · ${DB.snapshots.length} Bewertungen</p>
      </div></div>
      <div class="card"><div class="card-h"><h2>Sichern & Wiederherstellen</h2></div><div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="button" id="d-exp">${I.dl} Backup herunterladen</button>
        <button class="btn" type="button" id="d-imp">${I.ul} Backup importieren</button>
        <button class="btn danger" type="button" id="d-reset">Alle Daten löschen</button>
      </div></div>
    </div>`;
  $("#d-exp").onclick = () => { download(`vermoegen-backup-${todayISO()}.json`, JSON.stringify(DB, null, 1), "application/json"); store.set("last-backup", new Date().toISOString()); setStoreStatus(); };
  $("#d-imp").onclick = () => $("#file-in").click();
  $("#file-in").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (!obj.accounts || !obj.snapshots) throw 0;
      confirmDialog("Backup importieren?", `${obj.accounts.length} Konten und ${obj.snapshots.length} Bewertungen ersetzen die aktuellen Daten.`, "Importieren", () => { DB = obj; normalize(); store.set("last-backup", new Date().toISOString()); save(true); toast("Daten importiert"); go(); refreshQuotes(true); }, false);
    } catch { toast("Die Datei ist kein gültiges Backup"); }
    e.target.value = "";
  };
  $("#d-reset").onclick = () => confirmDialog("Alle Daten löschen?", "Konten und Bewertungen werden entfernt. Lade vorher ein Backup herunter.", "Endgültig löschen", () => { DB = {version: 1, currency: "EUR", categories: defaultCats(), accounts: [], snapshots: []}; save(true); go(); });
}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement("a"), {href: url, download: name}); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============ Dialogs ============ */
const dlg = $("#dlg");
function openDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
function confirmDialog(title, text, cta, onOk, danger = true) {
  openDlg(`<div class="dlg-h"><h2>${esc(title)}</h2></div><div class="dlg-b"><p style="margin:0" class="sub">${esc(text)}</p></div>
    <div class="dlg-f"><div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn ${danger ? "danger" : "primary"}" type="button" data-ok>${esc(cta)}</button></div></div>`);
  $("[data-x]", dlg).onclick = () => dlg.close();
  $("[data-ok]", dlg).onclick = () => { dlg.close(); onOk(); };
}
function accountDialog(acc, done) {
  const isNew = !acc;
  const a = acc ? {...acc} : {id: "", name: "", cat: DB.categories[0]?.key, kind: "manual", symbol: "", qty: null, archived: false};
  const used = acc && DB.snapshots.some(s => s.values[acc.id] != null);
  openDlg(`<form id="af"><div class="dlg-h"><h2>${isNew ? "Konto hinzufügen" : "Konto bearbeiten"}</h2><button class="btn ghost sm" type="button" data-x aria-label="Schließen">✕</button></div>
    <div class="dlg-b">
      <div class="field"><label for="a-name">Name</label><input class="input" id="a-name" required value="${esc(a.name)}" placeholder="z. B. Erste Bank Girokonto"></div>
      <div class="field"><label for="a-cat">Kategorie</label><select class="input" id="a-cat">${DB.categories.map(c => `<option value="${c.key}" ${c.key === a.cat ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></div>
      <div class="field"><label>Bewertung</label><div class="seg" id="a-kind">
        <button type="button" data-v="manual">Manuell</button><button type="button" data-v="stock">Wertpapier (Live-Kurs)</button><button type="button" data-v="crypto">Krypto (Live-Kurs)</button></div></div>
      <div id="a-live" style="display:grid;gap:12px">
        <div class="field"><label for="a-q">Suche nach Name, Ticker oder ISIN</label><input class="input" id="a-q" autocomplete="off" placeholder="z. B. MSCI World, AAPL, IE00B4L5Y983, Bitcoin"></div>
        <div class="results" id="a-res" hidden></div>
        <div class="row2">
          <div class="field"><label for="a-sym">Symbol</label><input class="input" id="a-sym" value="${esc(a.symbol)}" placeholder="z. B. EUNL.DE oder bitcoin"></div>
          <div class="field"><label for="a-qty">Stückzahl</label><input class="input n" id="a-qty" inputmode="decimal" value="${a.qty != null ? fmtQ.format(a.qty) : ""}" placeholder="0"></div>
        </div>
        <div class="hint" id="a-px"></div>
      </div>
      ${!isNew ? `<label class="check"><input type="checkbox" id="a-arch" ${a.archived ? "checked" : ""}> Archiviert (Konto existiert nicht mehr, bleibt im Verlauf erhalten)</label>` : ""}
    </div>
    <div class="dlg-f">${!isNew && !used ? '<button class="btn danger" type="button" data-del>Löschen</button>' : ""}<div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div></form>`);
  const kindBtns = $$("#a-kind button", dlg);
  const setKind = k => { a.kind = k; kindBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.v === k)); $("#a-live", dlg).hidden = k === "manual"; $("#a-q", dlg).placeholder = k === "crypto" ? "z. B. Bitcoin, Ethereum, Pluton" : "z. B. MSCI World, AAPL, IE00B4L5Y983"; };
  kindBtns.forEach(b => b.onclick = () => { setKind(b.dataset.v); $("#a-res", dlg).hidden = true; });
  setKind(a.kind);
  $$("[data-x]", dlg).forEach(b => b.onclick = () => dlg.close());
  const pxHint = async () => {
    const sym = $("#a-sym", dlg).value.trim(); const el = $("#a-px", dlg);
    if (!sym || a.kind === "manual") { el.textContent = ""; return; }
    el.textContent = "Kurs wird geprüft …";
    try {
      let price;
      const j = await MARKET.quotes(a.kind === "stock" ? [sym] : [], a.kind === "crypto" ? [sym] : []);
      price = j.quotes[`${a.kind}:${sym}`]; if (!price) throw new Error("none");
      QUOTES[`${a.kind}:${sym}`] = price;
      const qty = parseNum($("#a-qty", dlg).value) || 0;
      el.innerHTML = `Aktueller Kurs: <b class="num">${fmtN.format(price.priceEur)} €</b>${price.currency && price.currency !== "EUR" ? ` (${fmtN.format(price.price)} ${esc(price.currency)})` : ""}${qty ? ` · Wert: <b class="num">${eur(qty * price.priceEur)}</b>` : ""}`;
    } catch (e) { el.innerHTML = `<span class="neg">Kein Kurs gefunden für „${esc(sym)}“. Prüfe das Symbol.</span>`; }
  };
  let st;
  $("#a-q", dlg).oninput = e => {
    clearTimeout(st); const q = e.target.value.trim(); const res = $("#a-res", dlg);
    if (q.length < 2) { res.hidden = true; return; }
    st = setTimeout(async () => {
      try {
        let list;
        list = await MARKET.search(q, a.kind);
        res.hidden = false;
        res.innerHTML = Array.isArray(list) && list.length ? list.map(x => `<button type="button" data-s="${esc(x.symbol)}" data-n="${esc(x.name)}"><span><b>${esc(x.name)}</b><br><small>${esc(x.ticker)} · ${esc([x.type, x.exchange].filter(Boolean).join(" · "))}</small></span><small class="num">${esc(x.symbol)}</small></button>`).join("")
          : `<div style="padding:10px" class="muted">Keine Treffer.</div>`;
        $$("button", res).forEach(b => b.onclick = () => { $("#a-sym", dlg).value = b.dataset.s; if (!$("#a-name", dlg).value) $("#a-name", dlg).value = b.dataset.n; res.hidden = true; pxHint(); });
      } catch { res.hidden = false; res.innerHTML = '<div style="padding:10px" class="neg">Suche nicht erreichbar.</div>'; }
    }, 300);
  };
  $("#a-sym", dlg).onchange = pxHint; $("#a-qty", dlg).onchange = pxHint;
  if (a.symbol) pxHint();
  $("[data-del]", dlg)?.addEventListener("click", () => { DB.accounts = DB.accounts.filter(x => x.id !== acc.id); save(true); dlg.close(); toast("Konto gelöscht"); done(); });
  $("#af", dlg).onsubmit = e => {
    e.preventDefault();
    a.name = $("#a-name", dlg).value.trim(); a.cat = $("#a-cat", dlg).value;
    if (!a.name) return;
    if (a.kind !== "manual") {
      a.symbol = $("#a-sym", dlg).value.trim(); const q = parseNum($("#a-qty", dlg).value); a.qty = q == null || Number.isNaN(q) ? null : q;
      if (!a.symbol) { $("#a-px", dlg).innerHTML = '<span class="neg">Bitte ein Symbol wählen oder eingeben.</span>'; return; }
    } else { a.symbol = ""; }
    a.archived = $("#a-arch", dlg)?.checked || false;
    if (isNew) { a.id = (a.cat + "-" + a.name).toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) + "-" + uid().slice(0, 4); DB.accounts.push(a); }
    else Object.assign(acc, a);
    save(true); dlg.close(); toast(isNew ? "Konto angelegt" : "Konto gespeichert"); setLiveStatus(); done();
    if (isLive(a)) refreshQuotes(true);
  };
  setTimeout(() => $("#a-name", dlg).focus(), 30);
}
function categoryDialog(done) {
  const cats = DB.categories.map(c => ({...c}));
  const draw = () => {
    openDlg(`<form id="cf"><div class="dlg-h"><h2>Kategorien</h2><button class="btn ghost sm" type="button" data-x aria-label="Schließen">✕</button></div>
      <div class="dlg-b">${cats.map((c, i) => `<div style="display:flex;gap:8px;align-items:center"><i class="sw" style="background:var(--c${Math.min(i + 1, 9)})"></i><input class="input" data-i="${i}" value="${esc(c.label)}" aria-label="Kategorie ${i + 1}">
        <button class="btn ghost sm" type="button" data-up="${i}" ${i ? "" : "disabled"} aria-label="Nach oben">↑</button>
        ${DB.accounts.some(a => a.cat === c.key) ? "" : `<button class="btn ghost sm danger" type="button" data-rm="${i}" aria-label="Entfernen">✕</button>`}</div>`).join("")}
        <button class="btn sm" type="button" id="c-add" style="justify-self:start">${I.plus} Kategorie hinzufügen</button>
        <p class="hint" style="margin:0">Die Reihenfolge bestimmt die Farben. Kategorien mit Konten können nicht entfernt werden.</p></div>
      <div class="dlg-f"><div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div></form>`);
    const sync = () => $$("input[data-i]", dlg).forEach(i => cats[+i.dataset.i].label = i.value);
    $$("[data-x]", dlg).forEach(b => b.onclick = () => dlg.close());
    $$("[data-up]", dlg).forEach(b => b.onclick = () => { sync(); const i = +b.dataset.up; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; draw(); });
    $$("[data-rm]", dlg).forEach(b => b.onclick = () => { sync(); cats.splice(+b.dataset.rm, 1); draw(); });
    $("#c-add", dlg).onclick = () => { sync(); cats.push({key: "k" + uid(), label: "Neue Kategorie"}); draw(); };
    $("#cf", dlg).onsubmit = e => { e.preventDefault(); sync(); DB.categories = cats.filter(c => c.label.trim()).map(c => ({...c, label: c.label.trim()})); save(true); dlg.close(); toast("Kategorien gespeichert"); done(); };
  };
  draw();
}

/* ============ Theme ============ */
const THEMES = ["system", "light", "dark"], TL = {system: "System", light: "Hell", dark: "Dunkel"};
let theme = store.get("theme", "system");
const applyTheme = () => { theme === "system" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", theme); $("#theme-btn").textContent = "Design: " + TL[theme]; };
$("#theme-btn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(); resizeFns.forEach(f => f()); };
applyTheme();

/* ============ Boot ============ */
(async function boot() {
  await loadData();
  go();
  setLiveStatus();
  refreshQuotes(true);
  setInterval(() => { if (document.visibilityState === "visible") refreshQuotes(true); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
