<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracky</title>
<meta name="description" content="Tracky – Dein Vermögen. Immer im Blick.">
<meta name="theme-color" content="#0B0F1A">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" type="image/svg+xml" href="branding/favicon.svg">
<link rel="apple-touch-icon" href="branding/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tracky">
<style>
/* Tracky design system.
   Layout: fixed sidebar (desktop) / bottom tab bar (phone); content column max 1200px; cards for every content block.
   Tokens: neutrals with a slight navy bias, Emerald as the single brand accent, fixed colours per asset category. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F1F4F9; --surface-3:#E9EEF5; --line:#E3E8EF; --line-2:#CFD7E3;
  --ink:#0B0F1A; --ink-2:#475569; --ink-3:#64748B;
  --brand:#10B981; --brand-ink:#047857; --brand-soft:#E7F8F1; --on-brand:#04281C;
  --pos:#047857; --pos-bg:#E7F8F1; --neg:#DC2626; --neg-bg:#FDECEC; --warn:#92400E; --warn-bg:#FEF3C7;
  --chart:#10B981; --focus:#10B981; --side:#FFFFFF; --nav-active:#E7F8F1; --nav-active-ink:#047857;
  --cat-wertpapiere:#EA580C; --cat-liquiditaet:#2563EB; --cat-edelmetalle:#16A34A; --cat-guthaben:#7C3AED;
  --cat-krypto:#CA8A04; --cat-sachwerte:#DB2777; --cat-bargeld:#0891B2; --cat-kredite:#DC2626;
  --c1:#2563EB; --c2:#EA580C; --c3:#16A34A; --c4:#CA8A04; --c5:#7C3AED; --c6:#0891B2; --c7:#DB2777; --c8:#DC2626; --c9:#64748B;
  --f-ui:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(11,15,26,.04), 0 6px 20px rgba(11,15,26,.05);
  --shadow-lg:0 18px 50px rgba(11,15,26,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F1A; --surface:#121826; --surface-2:#182032; --surface-3:#1F293D; --line:#222C3F; --line-2:#2F3B52;
  --ink:#F1F5F9; --ink-2:#A9B4C6; --ink-3:#7D8AA0;
  --brand:#10B981; --brand-ink:#34D399; --brand-soft:rgba(16,185,129,.13); --on-brand:#04281C;
  --pos:#34D399; --pos-bg:rgba(16,185,129,.14); --neg:#F87171; --neg-bg:rgba(248,113,113,.13); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12);
  --chart:#34D399; --focus:#34D399; --side:#0E1320; --nav-active:rgba(16,185,129,.14); --nav-active-ink:#34D399;
  --cat-wertpapiere:#EA580C; --cat-liquiditaet:#3B82F6; --cat-edelmetalle:#16A34A; --cat-guthaben:#8B5CF6;
  --cat-krypto:#C08004; --cat-sachwerte:#DB2777; --cat-bargeld:#0891B2; --cat-kredite:#EF4444;
  --c1:#3B82F6; --c2:#EA580C; --c3:#16A34A; --c4:#C08004; --c5:#8B5CF6; --c6:#0891B2; --c7:#DB2777; --c8:#EF4444; --c9:#7D8AA0;
  --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0F1A; --surface:#121826; --surface-2:#182032; --surface-3:#1F293D; --line:#222C3F; --line-2:#2F3B52;
  --ink:#F1F5F9; --ink-2:#A9B4C6; --ink-3:#7D8AA0;
  --brand:#10B981; --brand-ink:#34D399; --brand-soft:rgba(16,185,129,.13); --on-brand:#04281C;
  --pos:#34D399; --pos-bg:rgba(16,185,129,.14); --neg:#F87171; --neg-bg:rgba(248,113,113,.13); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12);
  --chart:#34D399; --focus:#34D399; --side:#0E1320; --nav-active:rgba(16,185,129,.14); --nav-active-ink:#34D399;
  --cat-wertpapiere:#EA580C; --cat-liquiditaet:#3B82F6; --cat-edelmetalle:#16A34A; --cat-guthaben:#8B5CF6;
  --cat-krypto:#C08004; --cat-sachwerte:#DB2777; --cat-bargeld:#0891B2; --cat-kredite:#EF4444;
  --c1:#3B82F6; --c2:#EA580C; --c3:#16A34A; --c4:#C08004; --c5:#8B5CF6; --c6:#0891B2; --c7:#DB2777; --c8:#EF4444; --c9:#7D8AA0;
  --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.num,td.n,th.n,input.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
a.link{color:var(--brand-ink);text-decoration:none;font-weight:500} a.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none;display:block}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 14px;border-right:1px solid var(--line);background:var(--side)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;color:var(--ink);text-decoration:none}
.brand svg{display:block}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--nav-active);color:var(--nav-active-ink)}
.side-foot{margin-top:auto;display:grid;gap:12px;padding:10px 6px}
.status{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-3);line-height:1.4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:5px;flex:none}
.dot.ok{background:var(--brand)} .dot.warn{background:#F59E0B}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:20px}
.tabbar,.mobile-top{display:none}

/* ---------- type ---------- */
h1{font-size:26px;line-height:1.2;letter-spacing:-.025em;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:15.5px;font-weight:650;margin:0;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:72ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:0 14px;font-weight:550;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:650}
.btn.primary:hover{background:#0EA371;box-shadow:0 4px 14px rgba(16,185,129,.25)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--neg)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.sm.icon{width:30px;padding:0}
.btn .ic{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;height:28px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:550;color:var(--ink-2);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink)}
.seg button .ic{width:15px;height:15px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:550;color:var(--ink-2)}
.input{height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:0 12px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
select.input{padding-right:8px}
textarea.input{height:auto;min-height:150px;padding:10px 12px;resize:vertical;font-family:var(--f-mono);font-size:12.5px}
.input:hover{border-color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent)}
.input[aria-invalid="true"]{border-color:var(--neg)}
.input.sm{height:30px;padding:0 8px;border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;font-size:12px;font-weight:600;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.chip.pos{background:var(--pos-bg);color:var(--pos);border-color:transparent} .chip.neg{background:var(--neg-bg);color:var(--neg);border-color:transparent} .chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip .ic{width:13px;height:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0;flex-wrap:wrap}
.card-b{padding:16px 20px 20px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}

/* ---------- hero & KPIs ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:4px 2px}
.hero-total{font-size:clamp(38px,5.8vw,60px);font-weight:700;letter-spacing:-.04em;line-height:1.02;margin:8px 0 12px}
.hero-total .cents{color:var(--ink-3);font-weight:600}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-2);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:grid;gap:4px}
.kpi .kh{display:flex;align-items:center;gap:8px}
.kpi .kic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.kpi .kic .ic{width:16px;height:16px}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px}
.kpis.flat{gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.flat .kpi{border:0;border-radius:0;box-shadow:none;border-left:1px solid var(--line)}
.kpis.flat .kpi:first-child{border-left:0}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;height:300px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .axis text{fill:var(--ink-3);font-size:11px;font-family:var(--f-ui)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font-size:12.5px;box-shadow:var(--shadow-lg);min-width:190px;z-index:5}
.tip .t{font-weight:650;margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center;line-height:1.7}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.sw{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);padding:0 20px 18px}
.legend button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:inherit;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.4}
.donut-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center}
.donut-wrap > div:last-child{width:100%}
#ch-main{height:440px}
.donut{position:relative;width:180px;height:180px}
.donut svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.donut path{transition:opacity .15s}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .center b{font-size:18px;letter-spacing:-.02em}
.donut .center span{font-size:11.5px;color:var(--ink-3)}

/* ---------- category chip ---------- */
.cat-ic{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;flex:none;color:var(--cc);background:color-mix(in srgb, var(--cc) 14%, transparent)}
.cat-ic .ic{width:15px;height:15px}
.cat-ic.sm{width:22px;height:22px;border-radius:7px} .cat-ic.sm .ic{width:13px;height:13px}

/* ---------- lists ---------- */
.alloc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.alloc-row:first-child{border-top:0}
.alloc-row .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-row .val{text-align:right;font-weight:600}
.alloc-row .meta{grid-column:2/4;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.alloc-row.dim{opacity:.35}
.pos-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.pos-row:first-child{border-top:0}
.pos-row .nm{font-weight:550;display:flex;align-items:center;gap:10px;min-width:0}
.pos-row .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-row .sub2{font-size:12px;color:var(--ink-3)}
.pos-row .r{text-align:right;font-weight:600}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar-fill.neg{background:var(--neg)}
.struct{display:grid;gap:10px}
.struct .r{display:flex;justify-content:space-between;gap:12px}
.struct .r.total{border-top:1px solid var(--line-2);padding-top:10px;font-weight:700}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--brand);border-radius:4px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;background:var(--surface)}
tbody tr:hover td{background:color-mix(in srgb, var(--surface-2) 60%, transparent)}
td.n,th.n{text-align:right}
tr.cat td{font-weight:650;background:var(--surface-2)}
tr.total td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
tr.acc td:first-child{padding-left:44px;color:var(--ink-2)}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.matrix tr.cat td:first-child{background:var(--surface-2)}
.matrix th .hd{display:grid;gap:3px;justify-items:end}
.toggle{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:650}
.toggle .chev{width:14px;height:14px;transition:transform .15s}
.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cell-in{width:90px;text-align:right}
.inl{display:inline-flex;gap:10px;align-items:center}

/* ---------- valuation ---------- */
.val-head{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;align-items:end}
.val-group{overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;cursor:pointer;user-select:none}
.gh .l{display:flex;align-items:center;gap:10px;font-weight:650;min-width:0}
.gh .r{display:flex;align-items:center;gap:12px}
.gh .chev{width:15px;height:15px;transition:transform .15s;color:var(--ink-3)}
.gh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.vrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(90px,.7fr) minmax(150px,1fr) minmax(90px,.6fr);gap:12px;align-items:center;padding:9px 20px;border-top:1px solid var(--line)}
.vrow .nm{min-width:0}
.vrow .nm b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .nm small{color:var(--ink-3);font-size:12px;display:block}
.vrow .prev{text-align:right;color:var(--ink-3)}
.vrow .delta{text-align:right;font-size:13px;font-weight:550}
.vrow input.n{text-align:right}
.vrow-h{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:6px;padding-bottom:6px}
.savebar{position:sticky;bottom:0;z-index:20;padding-bottom:max(12px, env(safe-area-inset-bottom,0px))}
.savebar .in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow-lg)}
.savebar .tot{font-size:22px;font-weight:700;letter-spacing:-.02em}
.msg{padding:11px 14px;border-radius:var(--r-s);background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.msg.info{background:var(--surface-2);color:var(--ink-2)}
.msg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- accounts & holdings ---------- */
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.acc-row:hover{background:var(--surface-2)}
.acc-row.arch{opacity:.55}
.acc-row .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.h-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(70px,.6fr) minmax(80px,.7fr) minmax(64px,.5fr) minmax(90px,.8fr);gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.h-row:hover{background:var(--surface-2)}
.h-row.h{cursor:default;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:7px;padding-bottom:7px}
.h-row.h:hover{background:none}
.h-row .nm{min-width:0}
.h-row .nm b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-row .nm small{color:var(--ink-3);font-size:12px}
.h-row > span:not(.nm){text-align:right}
.type-badge{font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;margin-right:6px}
.logo{position:relative;width:26px;height:26px;border-radius:8px;flex:none;display:inline-grid;place-items:center;overflow:hidden;background:var(--surface-2);color:var(--ink-2);font-size:10px;font-weight:700;letter-spacing:-.02em;box-shadow:inset 0 0 0 1px var(--line);vertical-align:middle}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.logo.round{border-radius:50%}
.logo.lg{width:32px;height:32px;font-size:11.5px;border-radius:10px}
.logo.sm{width:22px;height:22px;font-size:9px;border-radius:7px}
.logo svg{width:62%;height:62%}
.logo.metal{background:none;box-shadow:none} .logo.metal svg{width:100%;height:100%}
.with-logo{display:flex;align-items:center;gap:10px;min-width:0}
.with-logo > span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line-2);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:var(--shadow-lg)}
dialog.wide{width:min(840px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(11,15,26,.55);backdrop-filter:blur(2px)}
.dlg-h{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-b{padding:16px 22px;display:grid;gap:14px}
.dlg-f{padding:0 22px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dlg-f .r{display:flex;gap:8px;margin-left:auto}
.results{border:1px solid var(--line);border-radius:var(--r-s);max-height:260px;overflow:auto}
.results button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover{background:var(--surface-2)}
.results small{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px}
.check input{accent-color:var(--brand);width:16px;height:16px}

/* ---------- feedback ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:550;z-index:100;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;z-index:90;pointer-events:none}
.celebrate .box{display:grid;justify-items:center;gap:4px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:18px 28px 22px;box-shadow:var(--shadow-lg);animation:pop .25s ease-out}
.celebrate .anim{width:120px;height:120px}
.celebrate .fx{position:fixed;inset:0;pointer-events:none}
.celebrate b{font-size:17px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.spark{display:block}
.hint{font-size:12.5px;color:var(--ink-3)}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* ---------- responsive ---------- */
@media (max-width: 1080px){
  .grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.flat .kpi:nth-child(3){border-left:0}
  .kpis.flat .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  main{padding-block:16px 100px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);border-top:1px solid var(--line);padding:6px max(4px, env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px, env(safe-area-inset-right,0px));justify-content:space-around}
  .tabbar a{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:550;color:var(--ink-3);text-decoration:none;padding:5px 2px;border-radius:10px;min-width:0;flex:1}
  .tabbar a[aria-current="page"]{color:var(--nav-active-ink);background:var(--nav-active)}
  .tabbar .ic{width:20px;height:20px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .kpis{gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:18px}
  .chart{height:240px}
  #ch-main{height:250px}
  .val-head{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:minmax(0,1fr) minmax(130px,1fr);padding:10px 14px}
  .vrow .prev,.vrow .delta,.vrow-h{display:none}
  .acc-row{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .acc-row .hide-sm{display:none}
  .h-row{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .h-row > .hide-sm{display:none}
  .savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .row2,.row3{grid-template-columns:1fr}
  .bar-row{grid-template-columns:minmax(0,120px) minmax(0,1fr) auto}
  .card-h{padding:16px 16px 0} .card-b{padding:14px 16px 16px} .gh{padding:13px 16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

  catch { return NaN; }
}

function migrate() {
  DB.categories ||= emptyDB().categories; DB.accounts ||= []; DB.snapshots ||= []; DB.lastQuotes ||= {};
  DB.accounts.forEach(a => {
    a.holdings ||= [];
    if ((a.kind === "stock" || a.kind === "crypto") && a.symbol && !a.holdings.length) a.holdings.push({id: "h" + uid(), type: a.kind, symbol: a.symbol, name: a.symbol, qty: a.qty || 0});

    s.values ||= {}; s.detail ||= {}; s.id ||= "s" + uid();
    if (s.quotes) { Object.entries(s.quotes).forEach(([id, q]) => { if (q && q.qty != null) s.detail[id] = {items: [{type: "crypto", qty: q.qty, price: q.price}]}; }); delete s.quotes; }
  });

  const p = DB.plan ||= {};

  p.budget ||= {income: 0, expenses: 0}; p.cashflows ||= [];

const RELAYS = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),

let relayFirst = store.get("relay", 0) % RELAYS.length;
async function getJSON(url, opts = {}, ms = 10000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, {...opts, signal: ctl.signal}); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function viaRelay(url) {
  let last;
  for (let k = 0; k < RELAYS.length; k++) {
    const i = (relayFirst + k) % RELAYS.length;
    try { const j = await getJSON(RELAYS[i](url)); if (i !== relayFirst) { relayFirst = i; store.set("relay", i); } return j; }
    catch (e) { last = e; }
  }

}

function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / count, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const t = []; for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) t.push(Math.round(v / step) * step);
  return t;
}
function timeTicks(x0, x1, maxTicks) {
  const months = (x1.getFullYear() - x0.getFullYear()) * 12 + x1.getMonth() - x0.getMonth();
  const stepM = [1, 2, 3, 6, 12, 24, 36, 60].find(s => months / s <= maxTicks) || 120;
  const t = []; let d = new Date(x0.getFullYear(), Math.ceil(x0.getMonth() / stepM) * stepM, 1);
  if (stepM >= 12) d = new Date(Math.ceil((x0.getFullYear() + (x0.getMonth() ? 1 : 0)) / (stepM / 12)) * (stepM / 12), 0, 1);
  while (d < x0) d = new Date(d.getFullYear(), d.getMonth() + stepM, 1);
  while (d <= x1) { t.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth() + stepM, 1); }
  return {t, yearly: stepM >= 12};
}

function sparkline(values, color, w = 64, h = 14) {

  const [whole, cents] = eur(tot).split(",");

  const isAth = tot >= H.v - 0.005;
  const remind = backupDue() ? `<div class="msg msg-row"><span>Deine Daten liegen nur in diesem Browser. Lade ein Backup herunter, damit nichts verloren geht.</span><a class="btn sm" href="#daten">${I.download} Zum Backup</a></div>` : "";
  const hasLive = allHoldings().length > 0;

  v.innerHTML = remind + `
    <section class="hero">
      <div>
        <div class="eyebrow">Nettovermögen · Stichtag ${fmtDateL(L.date)}</div>
        <div class="hero-total num">${esc(whole)}<span class="cents">,${esc(cents)}</span></div>
        <div class="hero-meta">
          ${P ? `<span class="chip ${cls(tot - ptot)}">${sEur(tot - ptot)} · ${pct(tot / ptot - 1)}</span><span>seit ${fmtDate(P.date)}</span>` : ""}
          <span class="chip ${isAth ? "pos" : ""}">${isAth ? I.trophy + " Allzeithoch" : `${pct(tot / H.v - 1)} unter dem Hoch vom ${fmtDate(H.d)}`}</span>

      ${kpi("12 Monate", y1 ? sEur0(tot - total(y1)) : "–", y1 ? `<span class="${cls(tot - total(y1))}">${pct(tot / total(y1) - 1)}</span> <span class="muted">ggü. ${fmtDate(y1.date)}</span>` : '<span class="muted">noch kein Jahr erfasst</span>', I.chartColumn)}
      ${kpi("Ø Zuwachs pro Monat", G ? sEur0(G.perMonth) : "–", G ? `<span class="muted">Wachstum ${pct(G.cagr).replace("+", "")} p. a. seit ${fmtDate(S[0].date)}</span>` : "", I.layers)}

        </div>

    </section>
    <section class="grid-2e">
      <div class="card">
        <div class="card-h"><h2>Nach Anbieter</h2><button class="btn ghost sm" type="button" id="prov-all">Alle anzeigen</button></div>

  // allocation: donut of asset categories + legend with amount, share and change

  const ord = k => { const i = DONUT_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  const ring = cats.filter(c => c.v > 0).sort((a, b) => ord(a.key) - ord(b.key));
  const recent = S.slice(-12);
  const R = 70, SW = 20, C = 2 * Math.PI * R, GAP = ring.length > 1 ? 3 : 0;
  let off = 0;
  $("#donut").innerHTML = `<svg viewBox="0 0 180 180" role="img" aria-label="Aufteilung der Vermögenswerte"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="${SW}"/>${ring.map(c => {
      const len = c.v / assets * C;
      const seg = `<circle data-k="${c.key}" cx="90" cy="90" r="${R}" fill="none" stroke="${catColor(c.key)}" stroke-width="${SW}" stroke-dasharray="${Math.max(0.01, len - GAP)} ${C}" stroke-dashoffset="${-off}" style="transition:opacity .15s;cursor:pointer"><title>${esc(c.label)}: ${eur0(c.v)} (${fmtPs.format(c.v / assets)})</title></circle>`;
      off += len; return seg; }).join("")}</svg><div class="center"><b class="num" id="dn-v">${eur0(assets)}</b><span id="dn-l">Vermögenswerte</span></div>`;
  $("#alloc").innerHTML = cats.map(c => `<div class="alloc-row" data-cat="${c.key}">${catChip(c.key, "sm")}<span class="nm">${esc(c.label)}</span><span class="val num">${eur0(c.v)}</span>
      <span class="meta"><span class="inl" style="gap:8px"><span class="num" style="min-width:42px">${c.v > 0 ? fmtPs.format(c.v / assets) : "Schuld"}</span>${sparkline(recent.map(s => catTotals(s)[c.key]), catColor(c.key))}</span><span class="num ${cls(c.v - c.p)}">${sEur0(c.v - c.p)}</span></span></div>`).join("") +
    `<p class="hint" style="margin:10px 0 0">Anteile an den Vermögenswerten (${eur0(assets)}).</p>`;
  const focus = k => {
    $$("#donut circle[data-k]").forEach(el => el.style.opacity = !k || el.dataset.k === k ? 1 : .25);
    $$("#alloc .alloc-row").forEach(el => el.classList.toggle("dim", !!k && el.dataset.cat !== k));
    const c = cats.find(x => x.key === k);

    $("#dn-l").textContent = c ? `${c.label} · ${c.v > 0 ? fmtPs.format(c.v / assets) : "Schuld"}` : "Vermögenswerte";
  };
  $$("#donut circle[data-k]").forEach(el => { el.onmouseenter = () => focus(el.dataset.k); el.onmouseleave = () => focus(null); });
  $$("#alloc .alloc-row").forEach(el => { el.onmouseenter = () => focus(el.dataset.cat); el.onmouseleave = () => focus(null); });

  // periods
  const per = [["Letzte Erfassung", P], ["1 Monat", snapAtOrBefore(addMonths(L.date, -1))], ["3 Monate", snapAtOrBefore(addMonths(L.date, -3))], ["6 Monate", snapAtOrBefore(addMonths(L.date, -6))], ["12 Monate", y1], ["3 Jahre", snapAtOrBefore(addMonths(L.date, -36))], ["5 Jahre", snapAtOrBefore(addMonths(L.date, -60))], ["Jahresbeginn", ytdBase], ["Erste Erfassung", S[0]]];
  $("#periods").innerHTML = `<thead><tr><th>Zeitraum</th><th>Stichtag</th><th class="n">Vermögen</th><th class="n">Δ</th><th class="n">Δ %</th></tr></thead><tbody>` +
    per.map(([l, s]) => s ? `<tr><td>${l}</td><td class="muted num">${fmtDate(s.date)}</td><td class="n">${eur0(total(s))}</td><td class="n ${cls(tot - total(s))}">${sEur0(tot - total(s))}</td><td class="n ${cls(tot - total(s))}">${pct(tot / total(s) - 1)}</td></tr>` : `<tr><td>${l}</td><td colspan="4" class="muted">noch keine Historie</td></tr>`).join("") + "</tbody>";

  // providers
  const prov = {};
  Object.entries(L.values).forEach(([id, val]) => { const a = accById(id); if (!a || !val) return; const k = a.provider || a.name; prov[k] = (prov[k] || 0) + val; });
  const provList = Object.entries(prov).sort((a, b) => b[1] - a[1]);
  const maxAbs = Math.max(...provList.map(p => Math.abs(p[1])), 1);
  let showAll = false;
  const drawProv = () => {
    const list = showAll ? provList : [...provList.filter(p => p[1] > 0).slice(0, 8), ...provList.filter(p => p[1] < 0).slice(-3)];
    $("#prov").innerHTML = list.map(([n, val]) => `<div class="bar-row"><span class="nm with-logo" title="${esc(n)}">${provLogo(n, "sm")}<span>${esc(n)}</span></span><span class="bar-track"><span class="bar-fill ${val < 0 ? "neg" : ""}" style="display:block;width:${Math.abs(val) / maxAbs * 100}%"></span></span><span class="num ${val < 0 ? "neg" : ""}">${eur0(val)}</span></div>`).join("");
    $("#prov-all").textContent = showAll ? "Weniger anzeigen" : `Alle ${provList.length} anzeigen`;
  };
  $("#prov-all").onclick = () => { showAll = !showAll; drawProv(); };
  drawProv();

  // movers
  const accs = Object.keys({...L.values, ...(P?.values || {})}).map(id => ({a: accById(id), val: L.values[id] || 0, prev: P?.values[id] || 0})).filter(o => o.a);
  const movers = accs.filter(o => Math.abs(o.val - o.prev) >= 1).sort((a, b) => Math.abs(b.val - b.prev) - Math.abs(a.val - a.prev)).slice(0, 8);
  $("#movers").innerHTML = movers.length ? movers.map(o => `<div class="pos-row"><span class="nm">${accLogo(o.a, "sm")}<span>${esc(o.a.name)}</span></span><span class="r num ${cls(o.val - o.prev)}">${sEur0(o.val - o.prev)}</span><span class="sub2" style="padding-left:28px"><i class="sw" style="background:${catColor(o.a.cat)};width:7px;height:7px"></i> ${esc(catLabel(o.a.cat))}</span><span class="sub2 r num">${eur0(o.prev)} → ${eur0(o.val)}</span></div>`).join("") : '<p class="muted" style="margin:0">Keine Veränderungen.</p>';

  // chart
  let mode = store.get("ov-mode", "total"), range = store.get("ov-range", "all");
  const hidden = new Set(store.get("ov-hidden", []));
  const draw = () => {
    $$("#seg-mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === mode));
    $$("#seg-range button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === range));
    let sub = S;
    if (range !== "all") { const iso = addMonths(L.date, -+range); sub = S.filter(s => s.date >= iso); if (sub.length < 2) sub = S.slice(-2); }
    const dates = sub.map(s => s.date), lg = $("#legend");
    if (mode === "total") { lg.hidden = true; lineChart($("#ch-main"), {dates, series: [{label: "Nettovermögen", color: "var(--chart)", values: sub.map(total)}], area: true}); }
    else {
      const used = DB.categories.filter(c => sub.some(s => catTotals(s)[c.key]));
      lg.hidden = false;
      lg.innerHTML = used.map(c => `<button type="button" data-k="${c.key}" aria-pressed="${!hidden.has(c.key)}"><i class="sw" style="background:${catColor(c.key)}"></i>${esc(c.label)}</button>`).join("");
      $$("button", lg).forEach(b => b.onclick = () => { hidden.has(b.dataset.k) ? hidden.delete(b.dataset.k) : hidden.add(b.dataset.k); store.set("ov-hidden", [...hidden]); draw(); });
      const series = used.filter(c => !hidden.has(c.key)).map(c => ({label: c.label, color: catColor(c.key), values: sub.map(s => catTotals(s)[c.key])}));
      lineChart($("#ch-main"), {dates, series: series.length ? series : [{label: "–", color: "var(--ink-3)", values: sub.map(() => 0)}]});
    }

  $$("#seg-range button").forEach(b => b.onclick = () => { range = b.dataset.v; store.set("ov-range", range); draw(); });
  draw(); resizeFns.push(draw);

  const paintLive = () => {
    const est = liveEstimate(), el = $("#live-chip"); if (!el) return;
    if (!est) { el.innerHTML = ""; return; }

  };
  paintLive(); onQuotes = paintLive;
  $("#btn-q")?.addEventListener("click", () => refreshQuotes(false));
};
const kpi = (l, val, d, icon) => `<div class="kpi"><div class="kh">${icon ? `<span class="kic">${icon}</span>` : ""}<span class="eyebrow">${l}</span></div><div class="v num">${val}</div><div class="d num">${d}</div></div>`;

/* ================= View: Bewertung ================= */
VIEWS.bewertung = v => {
  const editing = editId ? DB.snapshots.find(s => s.id === editId) : null;
  const base = editing ? DB.snapshots[DB.snapshots.indexOf(editing) - 1] : latest();
  const draft = editing ? {date: editing.date, note: editing.note || "", values: {...editing.values}, detail: JSON.parse(JSON.stringify(editing.detail || {}))} : {date: todayISO(), note: "", values: {}, detail: {}};
  const accounts = DB.accounts.filter(a => !a.archived || (editing && editing.values[a.id] != null));
  const liveFill = a => {
    const l = accLive(a); if (!l) return false;
    draft.values[a.id] = l.value;
    draft.detail[a.id] = {items: a.holdings.map(h => { const x = hVal(h); return {type: h.type, symbol: h.symbol || h.chain, qty: x.qty, price: x.price}; })};
    return true;
  };
  if (!editing) accounts.forEach(a => { if (!(isLive(a) && liveFill(a))) draft.values[a.id] = base?.values[a.id] ?? 0; });

    <div class="head"><div><h1>${editing ? "Bewertung bearbeiten" : "Neue Bewertung"}</h1>
      <p>${editing ? `Stichtag ${fmtDateL(editing.date)}.` : base ? `Alle Werte sind mit dem Stand vom ${fmtDate(base.date)} vorausgefüllt. Konten mit Depot-Positionen werden mit aktuellen Kursen berechnet. Ändere nur, was sich bewegt hat.` : "Trage für jedes Konto den aktuellen Wert ein."}</p></div>
      <div class="actions">
        ${allHoldings().length ? `<button class="btn" type="button" id="v-q" data-refresh>${I.refresh} Kurse laden</button>` : ""}
        <button class="btn" type="button" id="v-add">${I.plus} Konto hinzufügen</button>
      </div>
    </div>
    <div class="card"><div class="card-b val-head">
      <div class="field"><label for="v-date">Stichtag</label><input class="input" type="date" id="v-date" value="${draft.date}"></div>
      <div class="field"><label for="v-note">Notiz (optional)</label><input class="input" id="v-note" value="${esc(draft.note)}" placeholder="z. B. nach Bonuszahlung"></div>
      <div class="field"><span class="lbl">&nbsp;</span><span class="hint">Rechnen wie in Excel, z. B. <span class="num">629*4,69</span></span></div>
    </div></div>
    <div id="v-msg"></div>
    <div id="groups" style="display:grid;gap:14px"></div>
    <div class="savebar"><div class="in">
      <div><div class="eyebrow">Summe</div><div class="tot num" id="v-tot"></div></div>
      <div id="v-delta" class="num"></div>
      <div class="actions" style="margin-left:auto">
        ${editing ? `<button class="btn danger" type="button" id="v-del">Löschen</button><a class="btn" href="#verlauf">Abbrechen</a>` : ""}
        <button class="btn primary" type="button" id="v-save">${editing ? "Änderungen speichern" : "Bewertung speichern"}</button>
      </div>
    </div></div>`;
  const groups = $("#groups");
  const vrow = a => {
    const prev = base?.values[a.id], live = isLive(a), l = live ? accLive(a) : null;
    const gap = live && l && prev > 0 && l.value < prev * .7;
    return `<div class="vrow"><span class="nm with-logo">${accLogo(a)}<span><b>${esc(a.name)}</b>${live ? `<small>${a.holdings.length} Position${a.holdings.length > 1 ? "en" : ""} · ${l?.fresh ? '<span class="pos">Live-Kurs</span>' : l ? "letzter bekannter Kurs" : "kein Kurs"}${gap ? ' · <span class="neg">deutlich weniger als zuletzt, fehlen Positionen?</span>' : ""}</small>` : ""}</span></span>
      <span class="prev num">${prev != null ? eur(prev) : "–"}</span>
      <input class="input n" inputmode="decimal" data-acc="${a.id}" aria-label="Wert ${esc(a.name)}" value="${fmtN.format(draft.values[a.id] ?? 0)}">
      <span class="delta num" data-delta="${a.id}"></span></div>`;
  };
  const renderGroups = () => {
    groups.innerHTML = DB.categories.map(c => {
      const list = accounts.filter(a => a.cat === c.key); if (!list.length) return "";
      const o = open.has(c.key);
      return `<div class="card val-group" data-cat="${c.key}">
        <div class="gh" role="button" tabindex="0" aria-expanded="${o}"><span class="l">${I.chev}${catChip(c.key)}${esc(c.label)} <span class="muted" style="font-weight:400">${list.length}</span></span>
          <span class="r"><span class="num" data-cat-delta style="font-size:13px"></span><b class="num" data-cat-sum></b></span></div>
        <div class="gb" ${o ? "" : "hidden"}>
          <div class="vrow vrow-h"><span>Konto</span><span style="text-align:right">${base ? fmtDate(base.date) : "Vorher"}</span><span style="text-align:right">Neuer Wert</span><span style="text-align:right">Veränderung</span></div>

        </div></div>`;
    }).join("");
    $$(".gh", groups).forEach(h => {
      const t = () => { const k = h.parentElement.dataset.cat; open.has(k) ? open.delete(k) : open.add(k); store.set("val-open", [...open]); h.setAttribute("aria-expanded", open.has(k)); h.nextElementSibling.hidden = !open.has(k); };
      h.onclick = t; h.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } };

      inp.addEventListener("blur", () => { const n = parseNum(inp.value); if (okNum(n)) inp.value = fmtN.format(round2(n)); });
      inp.addEventListener("focus", () => inp.select());
    });
    updateTotals();
  };
  const updateTotals = only => {
    const t = total(draft), bt = total(base);
    $("#v-tot").textContent = eur(t);
    $("#v-delta").innerHTML = base ? `<span class="chip ${cls(t - bt)}">${sEur(t - bt)} · ${pct(t / bt - 1)}</span> <span class="muted">ggü. ${fmtDate(base.date)}</span>` : "";

    DB.categories.forEach(c => {
      const g = $(`.val-group[data-cat="${c.key}"]`, groups); if (!g) return;
      const ids = accounts.filter(a => a.cat === c.key).map(a => a.id);
      const s = ids.reduce((x, id) => x + (draft.values[id] || 0), 0), p = ids.reduce((x, id) => x + (base?.values[id] || 0), 0);
      $("[data-cat-sum]", g).textContent = eur(s);
      const de = $("[data-cat-delta]", g); de.className = "num " + cls(s - p); de.textContent = base && Math.abs(s - p) >= .005 ? sEur(s - p) : "";
    });
  };
  renderGroups();
  $("#v-date").onchange = e => draft.date = e.target.value;
  $("#v-note").oninput = e => draft.note = e.target.value;
  $("#v-q")?.addEventListener("click", async () => {
    await refreshQuotes(true);
    let n = 0; accounts.filter(isLive).forEach(a => { if (liveFill(a)) n++; });
    renderGroups(); toast(n ? `${n} Konto/Konten mit aktuellen Kursen bewertet` : "Keine aktuellen Kurse verfügbar");
  });
  $("#v-add").onclick = () => accountDialog(null, () => go());
  $("#v-del")?.addEventListener("click", () => confirmDialog(`Bewertung vom ${fmtDate(editing.date)} löschen?`, "Das lässt sich nicht rückgängig machen.", "Löschen", () => {
    DB.snapshots = DB.snapshots.filter(s => s !== editing); save(true); toast("Bewertung gelöscht"); location.hash = "#verlauf";
  }));
  $("#v-save").onclick = () => {
    const msg = $("#v-msg");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(draft.date)) { msg.innerHTML = '<div class="msg">Bitte ein gültiges Datum wählen.</div>'; return; }
    const clash = DB.snapshots.find(s => s.date === draft.date && s !== editing);
    if (clash) { msg.innerHTML = `<div class="msg">Für den ${fmtDate(draft.date)} gibt es schon eine Bewertung. Wähle ein anderes Datum oder <a href="#verlauf">bearbeite sie im Verlauf</a>.</div>`; return; }
    const prevAth = ath().v;
    const values = {}; Object.entries(draft.values).forEach(([id, val]) => { if (accById(id)) values[id] = round2(+val || 0); });
    const detail = {}; Object.entries(draft.detail).forEach(([id, d]) => { if (values[id] != null) detail[id] = d; });
    if (editing) Object.assign(editing, {date: draft.date, note: draft.note, values, detail});
    else DB.snapshots.push({id: "s" + uid(), date: draft.date, note: draft.note, values, detail});
    save(true);
    const t = total({values}), crossed = (DB.plan.milestones || []).filter(m => t >= m && prevAth < m).sort((a, b) => b - a)[0];
    if (!editing && crossed) celebrate(`Meilenstein ${eur0(crossed)} erreicht!`, `Nettovermögen ${eur0(t)}`, true);
    else if (!editing && t > prevAth && DB.snapshots.length > 1) celebrate("Neues Allzeithoch!", `Nettovermögen ${eur0(t)}`, true);
    else celebrate(editing ? "Änderungen gespeichert" : "Bewertung gespeichert", `Nettovermögen ${eur0(t)}`);
    editId = null; location.hash = "#uebersicht";
  };
};

function xirr(flows) {
  if (flows.length < 2) return NaN;
  const t0 = parseD(flows[0].date);
  const f = r => flows.reduce((s, c) => s + c.amount / Math.pow(1 + r, (parseD(c.date) - t0) / (365 * 864e5)), 0);
  let lo = -0.99, hi = 10, flo = f(lo), fhi = f(hi);
  if (flo * fhi > 0) return NaN;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (Math.abs(fm) < 1e-7) return mid; (flo * fm < 0) ? (hi = mid, fhi = fm) : (lo = mid, flo = fm); }
  return (lo + hi) / 2;
}
VIEWS.planung = v => {
  const L = latest(), P = DB.plan;
  if (!L) { v.innerHTML = `<div class="head"><h1>Ziele & Planung</h1></div><div class="card empty">Erfasse zuerst eine Bewertung.</div>`; return; }
  const tot = total(L), ct = catTotals(L), G = growthStats();
  v.innerHTML = `<div class="head"><div><h1>Ziele & Planung</h1><p>Soll-Aufteilung, Meilensteine, Prognose und deine echte Rendite. Grundlage ist die Bewertung vom ${fmtDate(L.date)} mit ${eur0(tot)}. Alle Eingaben werden sofort gespeichert.</p></div></div>
    <section class="card"><div class="card-h"><h2>Soll- und Ist-Aufteilung</h2><span id="t-sum" class="chip"></span></div><div class="tbl-wrap" style="margin-top:8px"><table id="tgt"></table></div></section>
    <section class="grid-2e">
      <div class="card"><div class="card-h"><h2>Meilensteine</h2><span class="muted" style="font-size:12.5px">bei Ø ${G ? eur0(G.perMonth) : "–"} pro Monat</span></div><div class="card-b" id="miles"></div></div>
      <div class="card"><div class="card-h"><h2>Monatliches Budget</h2></div><div class="card-b struct" id="budget"></div></div>
    </section>
    <section class="card"><div class="card-h"><h2>Prognose</h2><div class="actions" style="align-items:center"><label class="lbl" for="f-years">Jahre</label><input class="input sm n" id="f-years" style="width:70px" value="${P.years}"></div></div>
      <div class="card-b" style="display:grid;gap:16px"><div id="ch-fc" class="chart"></div><div class="legend" id="fc-legend" style="padding:0"></div><div class="tbl-wrap"><table id="fc"></table></div></div></section>
    <section class="card"><div class="card-h"><h2>Einzahlungen & echte Rendite</h2></div>
      <div class="card-b" style="display:grid;gap:14px"><p class="sub" style="margin:0">Trag hier ein, wie viel du von außen eingezahlt hast (Gehalt aufs Sparkonto, Überweisungen ins Depot) oder entnommen hast (negativ). Dann rechnet die App, wie viel dein Vermögen ohne deine Sparleistung gewachsen ist.</p>
      <div class="kpis flat" id="cf-kpis"></div>
      <div class="row3" style="align-items:end"><div class="field"><label for="cf-d">Datum</label><input class="input" type="date" id="cf-d" value="${todayISO()}"></div><div class="field"><label for="cf-a">Betrag</label><input class="input n" id="cf-a" inputmode="decimal" placeholder="z. B. 3.000"></div><div class="field"><label for="cf-n">Notiz</label><div style="display:flex;gap:8px"><input class="input" id="cf-n" placeholder="optional"><button class="btn" type="button" id="cf-add">${I.plus} Hinzufügen</button></div></div></div>
      <div class="tbl-wrap"><table id="cf"></table></div></div></section>`;

  // targets
  const drawTargets = () => {
    let sumT = 0;
    $("#tgt").innerHTML = `<thead><tr><th>Kategorie</th><th class="n">Ist</th><th class="n">Ist %</th><th class="n">Ziel %</th><th class="n">Ziel</th><th class="n">Abweichung</th><th>Maßnahme</th></tr></thead><tbody>` +
      DB.categories.map(c => {
        const ist = ct[c.key] || 0, t = P.targets[c.key] ?? 0; sumT += t;
        const goal = t * tot, dev = goal - ist, band = Math.max(.02 * tot, 250);
        const act = Math.abs(dev) <= band ? '<span class="chip">im Rahmen</span>' : dev > 0 ? '<span class="chip pos">aufbauen</span>' : '<span class="chip warn">reduzieren</span>';
        return `<tr><td><span class="inl">${catChip(c.key, "sm")}${esc(c.label)}</span></td><td class="n">${eur0(ist)}</td><td class="n">${fmtPs.format(tot ? ist / tot : 0)}</td>
          <td class="n"><input class="input sm n cell-in" data-t="${c.key}" value="${(t * 100).toLocaleString("de-DE", {maximumFractionDigits: 2})}" aria-label="Ziel in Prozent ${esc(c.label)}"> %</td>
          <td class="n">${eur0(goal)}</td><td class="n ${cls(dev)}">${sEur0(dev)}</td><td>${act}</td></tr>`;
      }).join("") + "</tbody>";
    const s = $("#t-sum"); s.textContent = `Summe der Ziele ${fmtPs.format(sumT)}`; s.className = "chip " + (Math.abs(sumT - 1) < .001 ? "pos" : "warn");
    $$("[data-t]").forEach(inp => inp.onchange = () => { const n = parseNum(inp.value); if (okNum(n)) { P.targets[inp.dataset.t] = n / 100; save(); drawTargets(); } else inp.setAttribute("aria-invalid", "true"); });

  drawTargets();

  // milestones
  const drawMiles = () => {
    const ms = [...P.milestones].sort((a, b) => a - b);
    $("#miles").innerHTML = `<div style="display:grid;gap:14px">${ms.map(m => {

      const eta = missing <= 0 ? "erreicht" : isFinite(months) ? "ca. " + parseD(addMonths(L.date, Math.ceil(months))).toLocaleDateString(LOCALE, {month: "long", year: "numeric"}) : "–";
      return `<div style="display:grid;gap:6px"><div class="split"><b class="num">${eur0(m)}</b><span class="${missing <= 0 ? "pos" : "muted"}">${eta}</span><button class="btn ghost sm" type="button" data-rm="${m}" aria-label="Meilenstein ${eur0(m)} entfernen">${I.x}</button></div>
        <div class="progress"><span style="width:${prog * 100}%"></span></div>
        <div class="split hint"><span>${fmtPs.format(prog)}</span><span>${missing > 0 ? "noch " + eur0(missing) : ""}</span></div></div>`;
    }).join("")}
    <div style="display:flex;gap:8px"><input class="input n" id="ms-new" inputmode="decimal" placeholder="Neues Ziel, z. B. 2.000.000" aria-label="Neuer Meilenstein"><button class="btn" type="button" id="ms-add">${I.plus}</button></div></div>`;
    $$("[data-rm]", $("#miles")).forEach(b => b.onclick = () => { P.milestones = P.milestones.filter(x => x !== +b.dataset.rm); save(); drawMiles(); });
    $("#ms-add").onclick = () => { const n = parseNum($("#ms-new").value); if (okNum(n) && n > 0) { P.milestones.push(n); save(); drawMiles(); } };
  };
  drawMiles();

  // budget & forecast
  const fcCats = DB.categories.filter(c => P.forecast[c.key] || ct[c.key]);
  const drawBudget = () => {
    const inc = +P.budget.income || 0, exp = +P.budget.expenses || 0, rate = inc - exp;
    const planned = Object.values(P.forecast).reduce((s, f) => s + (+f.monthly || 0), 0), gap = rate - planned;
    $("#budget").innerHTML = `<div class="r" style="align-items:center"><label for="b-inc">Einkommen</label><input class="input sm n" id="b-inc" style="width:120px;text-align:right" value="${fmtN.format(inc)}"></div>
      <div class="r" style="align-items:center"><label for="b-exp">Ausgaben</label><input class="input sm n" id="b-exp" style="width:120px;text-align:right" value="${fmtN.format(exp)}"></div>
      <div class="r total"><span>Sparrate</span><span class="num">${eur(rate)}</span></div>
      <div class="r"><span>davon in der Prognose verplant</span><span class="num">${eur(planned)}</span></div>
      <div class="r"><span>${gap >= 0 ? "noch frei" : "nicht gedeckt"}</span><b class="num ${gap >= 0 ? "pos" : "neg"}">${eur(gap)}</b></div>
      ${gap < 0 ? `<p class="msg" style="margin:0">Du verplanst monatlich ${eur0(-gap)} mehr, als du sparst. Passe die monatlichen Beträge in der Prognose oder dein Budget an.</p>` : ""}`;
    $("#b-inc").onchange = e => { const n = parseNum(e.target.value); if (okNum(n)) { P.budget.income = n; save(); drawBudget(); } };
    $("#b-exp").onchange = e => { const n = parseNum(e.target.value); if (okNum(n)) { P.budget.expenses = n; save(); drawBudget(); } };
  };
  const project = () => {
    const years = Math.max(1, Math.min(40, Math.round(P.years || 15)));
    const rows = fcCats.map(c => { const f = P.forecast[c.key] || {rate: 0, monthly: 0}; let val = ct[c.key] || 0; const out = [val]; for (let y = 1; y <= years; y++) { val = (val + (+f.monthly || 0) * 12) * (1 + (+f.rate || 0)); out.push(val); } return {c, f, out}; });
    const rest = tot - fcCats.reduce((s, c) => s + (ct[c.key] || 0), 0);
    const totals = Array.from({length: years + 1}, (_, y) => rows.reduce((s, r) => s + r.out[y], 0) + rest);
    return {years, rows, totals};
  };
  const drawForecast = () => {
    const {years, rows, totals} = project();
    const dates = Array.from({length: years + 1}, (_, y) => addMonths(L.date, 12 * y));
    const series = [{label: "Gesamt (Prognose)", color: "var(--chart)", values: totals}, ...rows.filter(r => (+r.f.rate || +r.f.monthly) && r.out.some(x => Math.abs(x) > 1)).map(r => ({label: r.c.label, color: catColor(r.c.key), values: r.out, dash: true}))];
    lineChart($("#ch-fc"), {dates, series, tipTitle: (d, i) => i === 0 ? "Heute" : `In ${i} Jahr${i > 1 ? "en" : ""} (${parseD(d).getFullYear()})`});
    $("#fc-legend").innerHTML = series.map(s => `<span style="display:inline-flex;gap:6px;align-items:center"><i class="sw" style="background:${s.color}"></i>${esc(s.label)}</span>`).join("");
    const cols = [1, 5, 10, years].filter((y, i, a) => y <= years && a.indexOf(y) === i);
    $("#fc").innerHTML = `<thead><tr><th>Kategorie</th><th class="n">Heute</th><th class="n">Rendite p. a.</th><th class="n">Monatlich</th>${cols.map(y => `<th class="n">in ${y} J.</th>`).join("")}</tr></thead><tbody>` +
      rows.map(r => `<tr><td><span class="inl">${catChip(r.c.key, "sm")}${esc(r.c.label)}</span></td><td class="n">${eur0(r.out[0])}</td>
        <td class="n"><input class="input sm n cell-in" style="width:70px" data-fr="${r.c.key}" value="${((r.f.rate || 0) * 100).toLocaleString("de-DE", {maximumFractionDigits: 2})}" aria-label="Rendite ${esc(r.c.label)}"> %</td>
        <td class="n"><input class="input sm n cell-in" data-fm="${r.c.key}" value="${fmtN.format(r.f.monthly || 0)}" aria-label="Monatlich ${esc(r.c.label)}"></td>
        ${cols.map(y => `<td class="n">${eur0(r.out[y])}</td>`).join("")}</tr>`).join("") +
      `<tr class="total"><td>Gesamt</td><td class="n">${eur0(totals[0])}</td><td></td><td class="n">${eur0(Object.values(P.forecast).reduce((s, f) => s + (+f.monthly || 0), 0))}</td>${cols.map(y => `<td class="n">${eur0(totals[y])}</td>`).join("")}</tr></tbody>`;
    const upd = (k, field, val) => { P.forecast[k] ||= {rate: 0, monthly: 0}; P.forecast[k][field] = val; save(); drawForecast(); drawBudget(); };
    $$("[data-fr]").forEach(i => i.onchange = () => { const n = parseNum(i.value); okNum(n) ? upd(i.dataset.fr, "rate", n / 100) : i.setAttribute("aria-invalid", "true"); });
    $$("[data-fm]").forEach(i => i.onchange = () => { const n = parseNum(i.value); okNum(n) ? upd(i.dataset.fm, "monthly", n) : i.setAttribute("aria-invalid", "true"); });
  };
  $("#f-years").onchange = e => { const n = parseNum(e.target.value); if (okNum(n) && n >= 1) { P.years = Math.min(40, Math.round(n)); save(); drawForecast(); } };
  drawBudget(); drawForecast(); resizeFns.push(drawForecast);

  // cashflows & XIRR
  const drawCF = () => {
    const S = DB.snapshots, f = S[0];
    const cfs = [...P.cashflows].sort((a, b) => a.date.localeCompare(b.date));
    const inflow = cfs.filter(c => c.date > f.date && c.date <= L.date).reduce((s, c) => s + c.amount, 0);
    const flows = [{date: f.date, amount: -total(f)}, ...cfs.filter(c => c.date > f.date && c.date <= L.date).map(c => ({date: c.date, amount: -c.amount})), {date: L.date, amount: tot}];
    const r = xirr(flows), gain = tot - total(f) - inflow;
    $("#cf-kpis").innerHTML = kpi("Startwert", eur0(total(f)), `<span class="muted">${fmtDate(f.date)}</span>`) + kpi("Einzahlungen", sEur0(inflow), `<span class="muted">${cfs.length} Buchung${cfs.length === 1 ? "" : "en"}</span>`) +
      kpi("Wertzuwachs ohne Einzahlungen", sEur0(gain), `<span class="muted">bis ${fmtDate(L.date)}</span>`) + kpi("Echte Rendite p. a.", isFinite(r) ? pct(r) : "–", `<span class="muted">Wachstum inkl. Einzahlungen ${G ? pct(G.cagr) : "–"}</span>`);
    $("#cf").innerHTML = cfs.length ? `<thead><tr><th>Datum</th><th class="n">Betrag</th><th>Notiz</th><th></th></tr></thead><tbody>${cfs.map(c => `<tr><td class="num">${fmtDate(c.date)}</td><td class="n ${cls(c.amount)}">${sEur(c.amount)}</td><td>${esc(c.note || "")}</td><td class="n"><button class="btn ghost sm" type="button" data-cfrm="${c.id}" aria-label="Löschen">${I.trash}</button></td></tr>`).join("")}</tbody>` : `<tbody><tr><td class="muted">Noch keine Ein- oder Auszahlungen erfasst. Ohne Einzahlungen entspricht die echte Rendite dem Gesamtwachstum.</td></tr></tbody>`;
    $$("[data-cfrm]").forEach(b => b.onclick = () => { P.cashflows = P.cashflows.filter(c => c.id !== b.dataset.cfrm); save(); drawCF(); });
  };
  $("#cf-add").onclick = () => {
    const d = $("#cf-d").value, a = parseNum($("#cf-a").value);
    if (!d || !okNum(a) || !a) { $("#cf-a").setAttribute("aria-invalid", "true"); return; }
    P.cashflows.push({id: "c" + uid(), date: d, amount: a, note: $("#cf-n").value.trim()}); save(); $("#cf-a").value = ""; $("#cf-n").value = ""; drawCF();
  };
  drawCF();
};

$("#file-in").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj.accounts || !obj.snapshots) throw 0;
    const doIt = () => { DB = obj; migrate(); store.set("last-backup", new Date().toISOString()); save(true); toast("Daten importiert"); location.hash = "#uebersicht"; go(); refreshQuotes(true); };
    DB.snapshots.length ? confirmDialog("Daten importieren?", `${obj.accounts.length} Konten und ${obj.snapshots.length} Bewertungen ersetzen die aktuellen Daten.`, "Importieren", doIt, false) : doIt();
  } catch { toast("Die Datei ist kein gültiges Backup"); }
};
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement("a"), {href: url, download: name}); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

    el.innerHTML = item.type === "wallet" ? `Guthaben: <b class="num">${fmtQ.format(q.balance)} ${CHAINS[item.chain].ticker}</b> · Wert <b class="num">${eur(q.balance * q.priceEur)}</b>`
      : `Aktueller Kurs: <b class="num">${fmtPx(q.priceEur)} €</b>${q.currency && q.currency !== "EUR" && q.price ? ` (${fmtPx(q.price)} ${esc(q.currency)})` : ""}${item.type === "metal" ? " je Feinunze" : ""}${qty ? ` · Wert <b class="num">${eur(qty * q.priceEur)}</b>` : ""}`;
    if (!$("#h-sym", dlg).dataset.named && q.name && item.type === "stock" && !st.name) st.name = q.name;
  };
  const collect = quiet => {
    const t = st.type;
    if (t === "wallet") { const addr = $("#h-addr", dlg).value.trim(), chain = $("#h-chain", dlg).value; if (!addr) return null; return {type: t, chain, address: addr, name: CHAINS[chain].name + " Wallet"}; }
    if (t === "metal") { const sym = $("#h-mt", dlg).value, q = parseNum($("#h-qty", dlg).value); const oz = okNum(q) ? ($("#h-unit", dlg).value === "g" ? q / OZ_G : q) : null; return {type: t, symbol: sym, name: METALS[sym].name, qty: oz}; }
    const sym = $("#h-sym", dlg).value.trim(); if (!sym) return null; const q = parseNum($("#h-qty", dlg).value);
    return {type: t, symbol: sym, name: st.name || sym, isin: st.isin || "", logo: st.logo || "", qty: okNum(q) ? q : null};
  };
  const runSearch = debounce(async q => {
    const res = $("#h-res", dlg);
    if (q.length < 2) { res.hidden = true; return; }
    res.hidden = false; res.innerHTML = '<div style="padding:10px" class="muted">Suche …</div>';
    try {
      const list = await MARKET.search(q, st.type);
      res.innerHTML = list.length ? list.map((x, i) => `<button type="button" data-i="${i}"><span class="with-logo">${st.type === "crypto" ? logoBox(x.logo, x.name, "", true) : holdingLogo({type: "stock", symbol: x.symbol, name: x.name})}<span><b>${esc(x.name)}</b><br><small>${esc([x.ticker, x.type, x.exchange].filter(Boolean).join(" · "))}</small></span></span><small class="num">${esc(x.symbol)}</small></button>`).join("") : '<div style="padding:10px" class="muted">Keine Treffer.</div>';
      $$("button", res).forEach(b => b.onclick = () => {
        const x = list[+b.dataset.i]; $("#h-sym", dlg).value = x.symbol; st.name = x.name; st.logo = x.logo || ""; if (/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(q.trim())) st.isin = q.trim();
        res.hidden = true; $("#h-qty", dlg).focus(); check();
      });
    } catch { res.innerHTML = '<div style="padding:10px" class="neg">Suche gerade nicht erreichbar. Du kannst das Symbol auch direkt eintragen.</div>'; }
  }, 350);
  $("#h-q", dlg).oninput = e => runSearch(e.target.value.trim());
  ["#h-sym", "#h-qty", "#h-mt", "#h-unit", "#h-chain", "#h-addr"].forEach(s => $(s, dlg).addEventListener("change", check));
  if (!isNew) { check(); $("#h-sym", dlg).dataset.named = "1"; }
  $("[data-del]", dlg)?.addEventListener("click", () => { acc.holdings = acc.holdings.filter(x => x.id !== h.id); save(true); dlg.close(); toast("Position entfernt"); done(); });
  $("#hf", dlg).onsubmit = e => {
    e.preventDefault();
    const item = collect(); const px = $("#h-px", dlg);
    if (!item) { px.innerHTML = '<span class="neg">Bitte ein Wertpapier wählen bzw. eine Adresse eingeben.</span>'; return; }
    if (item.type === "wallet" && !CHAINS[item.chain].re.test(item.address)) { px.innerHTML = `<span class="neg">Das sieht nicht nach einer gültigen ${CHAINS[item.chain].name}-Adresse aus.</span>`; return; }
    if (item.type !== "wallet" && !(item.qty > 0)) { px.innerHTML = '<span class="neg">Bitte eine Menge größer 0 eingeben.</span>'; return; }
    const finish = target => {
      if (isNew) target.holdings.push({id: "h" + uid(), ...item});
      else { Object.assign(h, item); if (target !== acc) { acc.holdings = acc.holdings.filter(x => x !== h); target.holdings.push(h); } }
      save(true); dlg.close(); toast(isNew ? "Position hinzugefügt" : "Position gespeichert"); done(); refreshQuotes(true);
    };
    const sel = $("#h-acc", dlg).value;
    if (sel === "__new") {
      const cat = {stock: "wertpapiere", crypto: "krypto", metal: "edelmetalle", wallet: "krypto"}[item.type];
      const name = item.type === "wallet" ? item.name : item.type === "metal" ? "Edelmetalle" : "Depot";
      const na = {id: slugId(cat, name), name, provider: name, cat, holdings: [], archived: false}; DB.accounts.push(na); finish(na);
    } else finish(accById(sel));
  };
  setTimeout(() => (isNew ? $("#h-q", dlg) : $("#h-qty", dlg)).focus(), 30);
}

/** Paste a holdings list from online banking: ISIN + quantity per line. */
function parseDepotText(text) {
  const out = new Map(), lines = text.split(/\r?\n/);
  const num = s => parseNum(s);
  lines.forEach((line, i) => {
    const m = line.match(/\b([A-Z]{2}[A-Z0-9]{9}\d)\b/); if (!m) return;
    const isin = m[1];
    let rest = line.slice(m.index + isin.length);
    let cand = rest.match(/(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?)\s*(?:Stk\.?|Stück|St\.)/i) || line.match(/(?:Stk\.?|Stück|St\.)\s*:?\s*(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?)/i);
    if (!cand) { const nums = (rest.match(/-?\d{1,3}(?:\.\d{3})*(?:,\d+)?|-?\d+(?:[.,]\d+)?/g) || []).filter(x => !/^[A-Z0-9]{6}$/.test(x)); if (nums.length) cand = [null, nums[0]]; }
    if (!cand && lines[i + 1]) { const n2 = lines[i + 1].match(/(\d{1,3}(?:\.\d{3})*(?:,\d+)?|\d+(?:[.,]\d+)?)/); if (n2) cand = [null, n2[1]]; }
    const name = line.slice(0, m.index).replace(/[\t|;]+/g, " ").trim() || (lines[i - 1] && !/\d{3}/.test(lines[i - 1]) ? lines[i - 1].trim() : "");
    const q = cand ? num(cand[1]) : null;
    out.set(isin, {isin, name, qty: okNum(q) ? q : null});
  });
  return [...out.values()];
}
function importDepotDialog(done) {
  const accs = DB.accounts.filter(a => !a.archived && (a.cat === "wertpapiere" || isLive(a)));
  openDlg(`<div class="dlg-h"><h2>Depot einfügen</h2><button class="btn ghost sm" type="button" data-x aria-label="Schließen">${I.x}</button></div>
    <div class="dlg-b">
      <p class="sub" style="margin:0">Öffne die Depotübersicht bei Flatex (oder einem anderen Broker), markiere die Tabelle mit allen Positionen, kopiere sie und füge sie hier ein. Die App sucht in jeder Zeile die ISIN und die Stückzahl. Vor dem Übernehmen kannst du alles prüfen.</p>
      <div class="field"><label for="dp-acc">In welches Konto?</label><select class="input" id="dp-acc">${accs.map(a => `<option value="${a.id}">${esc(a.name)} · ${esc(catLabel(a.cat))}</option>`).join("")}</select></div>
      <div class="field"><label for="dp-txt">Bestandsliste</label><textarea class="input" id="dp-txt" placeholder="iShares Core MSCI World   IE00B4L5Y983   125 Stk.&#10;Apple Inc.   US0378331005   10"></textarea></div>
      <div id="dp-prev"></div>
    </div>
    <div class="dlg-f"><label class="check"><input type="checkbox" id="dp-repl"> Bestehende Positionen dieses Kontos ersetzen</label><div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn primary" type="button" id="dp-ok" disabled>Übernehmen</button></div></div>`, true);
  let rows = [];
  const drawPrev = () => {
    $("#dp-prev", dlg).innerHTML = rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>ISIN</th><th>Wertpapier</th><th class="n">Stück</th><th>Kurs</th></tr></thead><tbody>${rows.map((r, i) => `<tr><td class="mono">${r.isin}</td><td style="white-space:normal">${esc(r.name || "")}${r.symbol ? `<br><small class="muted">${esc(r.symbol)}</small>` : r.state === "busy" ? '<br><small class="muted">wird gesucht …</small>' : r.state === "fail" ? '<br><small class="neg">nicht gefunden, wird übersprungen</small>' : ""}</td><td class="n"><input class="input sm n cell-in" data-q="${i}" value="${r.qty != null ? fmtQ.format(r.qty) : ""}" aria-label="Stück ${r.isin}"></td><td class="num">${r.price != null ? fmtPx(r.price) + " €" : "–"}</td></tr>`).join("")}</tbody></table></div>`
      : $("#dp-txt", dlg).value.trim() ? '<p class="msg" style="margin:0">Keine ISIN gefunden. Jede Position braucht ihre 12-stellige ISIN, zum Beispiel IE00B4L5Y983.</p>' : "";
    $$("[data-q]", dlg).forEach(inp => inp.onchange = () => { const n = parseNum(inp.value); rows[+inp.dataset.q].qty = okNum(n) ? n : null; okBtn(); });
    okBtn();
  };
  const okBtn = () => { $("#dp-ok", dlg).disabled = !rows.some(r => r.symbol && r.qty > 0); };
  const resolve = debounce(async () => {
    rows = parseDepotText($("#dp-txt", dlg).value).map(r => ({...r, state: "busy"})); drawPrev();
    for (const r of rows) {
      try {
        const list = await MARKET.search(r.isin, "stock");
        const x = list.length ? pickListing(list) : null;
        if (x) { r.symbol = x.symbol; r.name = r.name || x.name; r.state = "ok"; try { const j = await MARKET.quotes([{type: "stock", symbol: x.symbol}]); const q = j.quotes["stock:" + x.symbol]; if (q) { r.price = q.priceEur; QUOTES["stock:" + x.symbol] = q; if (!r.name || r.name.length < 3) r.name = q.name; } } catch {} }
        else r.state = "fail";
      } catch { r.state = "fail"; }
      drawPrev();
    }
  }, 500);
  $("#dp-txt", dlg).oninput = resolve;
  $("#dp-ok", dlg).onclick = () => {
    const a = accById($("#dp-acc", dlg).value); if (!a) return;
    if ($("#dp-repl", dlg).checked) a.holdings = a.holdings.filter(h => h.type !== "stock");
    let n = 0;
    rows.filter(r => r.symbol && r.qty > 0).forEach(r => {
      const ex = a.holdings.find(h => h.isin === r.isin || h.symbol === r.symbol);
      if (ex) ex.qty = r.qty; else a.holdings.push({id: "h" + uid(), type: "stock", symbol: r.symbol, isin: r.isin, name: r.name || r.symbol, qty: r.qty});
      n++;
    });
    save(true); dlg.close(); toast(`${n} Position${n === 1 ? "" : "en"} übernommen`); done(); refreshQuotes(true);
  };
  if (!accs.length) $("#dp-prev", dlg).innerHTML = '<p class="msg" style="margin:0">Lege zuerst ein Konto in der Kategorie „Aktien & ETFs“ an.</p>';
}
function categoryDialog(done) {
  const cats = DB.categories.map(c => ({...c}));
  const draw = () => {
    openDlg(`<form id="cf"><div class="dlg-h"><h2>Kategorien</h2><button class="btn ghost sm" type="button" data-x aria-label="Schließen">${I.x}</button></div>
      <div class="dlg-b">${cats.map((c, i) => `<div style="display:flex;gap:8px;align-items:center">${catChip(c.key)}<input class="input" data-i="${i}" value="${esc(c.label)}" aria-label="Kategorie ${i + 1}">
        <button class="btn ghost sm" type="button" data-up="${i}" ${i ? "" : "disabled"} aria-label="Nach oben">↑</button>
        ${DB.accounts.some(a => a.cat === c.key) ? "" : `<button class="btn ghost sm danger" type="button" data-rm="${i}" aria-label="Entfernen">${I.x}</button>`}</div>`).join("")}
        <button class="btn sm" type="button" id="c-add" style="justify-self:start">${I.plus} Kategorie hinzufügen</button>
        <p class="hint" style="margin:0">Jede Kategorie hat eine feste Farbe und ein festes Symbol. Kategorien mit Konten können nicht entfernt werden.</p></div>
      <div class="dlg-f"><div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div></form>`);
    const sync = () => $$("input[data-i]", dlg).forEach(i => cats[+i.dataset.i].label = i.value);
    $$("[data-up]", dlg).forEach(b => b.onclick = () => { sync(); const i = +b.dataset.up; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; draw(); });
    $$("[data-rm]", dlg).forEach(b => b.onclick = () => { sync(); cats.splice(+b.dataset.rm, 1); draw(); });
    $("#c-add", dlg).onclick = () => { sync(); cats.push({key: "k" + uid(), label: "Neue Kategorie"}); draw(); };
    $("#cf", dlg).onsubmit = e => { e.preventDefault(); sync(); DB.categories = cats.filter(c => c.label.trim()).map(c => ({...c, label: c.label.trim()})); save(true); dlg.close(); toast("Kategorien gespeichert"); done(); };
  };
  draw();
}

/* ================= Theme & boot ================= */
const THEMES = [["light", "Hell", I.sun], ["dark", "Dunkel", I.moon], ["system", "System", I.monitor]];
let theme = store.get("theme", "system");
function applyTheme() {
  theme === "system" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", theme);
  $$(".theme-seg").forEach(el => {
    el.innerHTML = THEMES.map(([k, l, ic]) => `<button type="button" data-theme-set="${k}" aria-pressed="${theme === k}" title="${l}" aria-label="Darstellung ${l}">${ic}${el.dataset.labels ? l : ""}</button>`).join("");
    $$("button", el).forEach(b => b.onclick = () => { theme = b.dataset.themeSet; store.set("theme", theme); applyTheme(); resizeFns.forEach(f => f()); });
  });
}
applyTheme();
(async function boot() {
  await loadData();
  go(); setLiveStatus();
  refreshQuotes(true);
  setInterval(() => { if (document.visibilityState === "visible") refreshQuotes(true); }, 5 * 60 * 1000);
})();
</script>
