<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracky</title>
<meta name="description" content="Tracky – Dein Vermögen. Immer im Blick.">
<meta name="theme-color" content="#0B0F1A">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" type="image/svg+xml" href="branding/favicon.svg">
<link rel="apple-touch-icon" href="branding/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tracky">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Tracky design system.
   Layout: fixed sidebar (desktop) / bottom tab bar (phone); content column max 1200px; cards for every content block.
   Tokens: neutrals with a slight navy bias, Emerald as the single brand accent, fixed colours per asset category. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F1F4F9; --surface-3:#E9EEF5; --line:#E3E8EF; --line-2:#CFD7E3;
  --ink:#0B0F1A; --ink-2:#475569; --ink-3:#64748B;
  --brand:#10B981; --brand-ink:#047857; --brand-soft:#E7F8F1; --on-brand:#04281C;
  --pos:#047857; --pos-bg:#E7F8F1; --neg:#DC2626; --neg-bg:#FDECEC; --warn:#92400E; --warn-bg:#FEF3C7;
  --chart:#10B981; --focus:#10B981; --side:#FFFFFF; --nav-active:#E7F8F1; --nav-active-ink:#047857;
  --cat-wertpapiere:#EA580C; --cat-liquiditaet:#2563EB; --cat-edelmetalle:#16A34A; --cat-guthaben:#7C3AED;
  --cat-krypto:#CA8A04; --cat-sachwerte:#DB2777; --cat-bargeld:#0891B2; --cat-kredite:#DC2626;
  --c1:#2563EB; --c2:#EA580C; --c3:#16A34A; --c4:#CA8A04; --c5:#7C3AED; --c6:#0891B2; --c7:#DB2777; --c8:#DC2626; --c9:#64748B;
  --f-ui:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --r-s:10px;
  --shadow:0 1px 2px rgba(11,15,26,.04), 0 6px 20px rgba(11,15,26,.05);
  --shadow-lg:0 18px 50px rgba(11,15,26,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0F1A; --surface:#121826; --surface-2:#182032; --surface-3:#1F293D; --line:#222C3F; --line-2:#2F3B52;
  --ink:#F1F5F9; --ink-2:#A9B4C6; --ink-3:#7D8AA0;
  --brand:#10B981; --brand-ink:#34D399; --brand-soft:rgba(16,185,129,.13); --on-brand:#04281C;
  --pos:#34D399; --pos-bg:rgba(16,185,129,.14); --neg:#F87171; --neg-bg:rgba(248,113,113,.13); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12);
  --chart:#34D399; --focus:#34D399; --side:#0E1320; --nav-active:rgba(16,185,129,.14); --nav-active-ink:#34D399;
  --cat-wertpapiere:#EA580C; --cat-liquiditaet:#3B82F6; --cat-edelmetalle:#16A34A; --cat-guthaben:#8B5CF6;
  --cat-krypto:#C08004; --cat-sachwerte:#DB2777; --cat-bargeld:#0891B2; --cat-kredite:#EF4444;
  --c1:#3B82F6; --c2:#EA580C; --c3:#16A34A; --c4:#C08004; --c5:#8B5CF6; --c6:#0891B2; --c7:#DB2777; --c8:#EF4444; --c9:#7D8AA0;
  --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0F1A; --surface:#121826; --surface-2:#182032; --surface-3:#1F293D; --line:#222C3F; --line-2:#2F3B52;
  --ink:#F1F5F9; --ink-2:#A9B4C6; --ink-3:#7D8AA0;
  --brand:#10B981; --brand-ink:#34D399; --brand-soft:rgba(16,185,129,.13); --on-brand:#04281C;
  --pos:#34D399; --pos-bg:rgba(16,185,129,.14); --neg:#F87171; --neg-bg:rgba(248,113,113,.13); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12);
  --chart:#34D399; --focus:#34D399; --side:#0E1320; --nav-active:rgba(16,185,129,.14); --nav-active-ink:#34D399;
  --cat-wertpapiere:#EA580C; --cat-liquiditaet:#3B82F6; --cat-edelmetalle:#16A34A; --cat-guthaben:#8B5CF6;
  --cat-krypto:#C08004; --cat-sachwerte:#DB2777; --cat-bargeld:#0891B2; --cat-kredite:#EF4444;
  --c1:#3B82F6; --c2:#EA580C; --c3:#16A34A; --c4:#C08004; --c5:#8B5CF6; --c6:#0891B2; --c7:#DB2777; --c8:#EF4444; --c9:#7D8AA0;
  --shadow:none; --shadow-lg:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.num,td.n,th.n,input.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
a.link{color:var(--brand-ink);text-decoration:none;font-weight:500} a.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none;display:block}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:20px 14px;border-right:1px solid var(--line);background:var(--side)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;color:var(--ink);text-decoration:none}
.brand svg{display:block}
.nav{display:grid;gap:2px}
.nav-group{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:14px 11px 6px}
.nav-group:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--nav-active);color:var(--nav-active-ink)}
.side-foot{margin-top:auto;display:grid;gap:12px;padding:10px 6px}
.status{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink-3);line-height:1.4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-top:5px;flex:none}
.dot.ok{background:var(--brand)} .dot.warn{background:#F59E0B}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:20px}
.tabbar,.mobile-top{display:none}

/* ---------- type ---------- */
h1{font-size:26px;line-height:1.2;letter-spacing:-.025em;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:15.5px;font-weight:650;margin:0;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)} .sub{color:var(--ink-2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:72ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:0 14px;font-weight:550;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:650}
.btn.primary:hover{background:#0EA371;box-shadow:0 4px 14px rgba(16,185,129,.25)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--neg)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.sm.icon{width:30px;padding:0}
.btn .ic{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;height:28px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:550;color:var(--ink-2);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink)}
.seg button .ic{width:15px;height:15px}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:550;color:var(--ink-2)}
.input{height:38px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:0 12px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
select.input{padding-right:8px}
textarea.input{height:auto;min-height:150px;padding:10px 12px;resize:vertical;font-family:var(--f-mono);font-size:12.5px}
.input:hover{border-color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent)}
.input[aria-invalid="true"]{border-color:var(--neg)}
.input.sm{height:30px;padding:0 8px;border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;font-size:12px;font-weight:600;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:1px solid var(--line)}
.chip.pos{background:var(--pos-bg);color:var(--pos);border-color:transparent} .chip.neg{background:var(--neg-bg);color:var(--neg);border-color:transparent} .chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip .ic{width:13px;height:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0;flex-wrap:wrap}
.card-b{padding:16px 20px 20px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}

/* ---------- hero & KPIs ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:4px 2px}
.hero-total{font-size:clamp(38px,5.8vw,60px);font-weight:700;letter-spacing:-.04em;line-height:1.02;margin:8px 0 12px}
.hero-row{display:flex;align-items:center;gap:12px}
.hero-row .priv-hero{flex:none}
body.privacy .hero-total{letter-spacing:.02em;color:var(--ink-2)}
body.privacy input.n:not(:focus),body.privacy .cell-in:not(:focus){filter:blur(6px)}
body.privacy .priv-hero,body.privacy [data-priv][aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.hero-total .cents{color:var(--ink-3);font-weight:600}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink-2);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:grid;gap:4px}
.kpi .kh{display:flex;align-items:center;gap:8px}
.kpi .kic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.kpi .kic .ic{width:16px;height:16px}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:12.5px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi-link{text-decoration:none;color:inherit;transition:border-color .12s,transform .12s}
.kpi-link:hover{border-color:var(--brand)}
.kpi .kic .lf-ic{width:16px;height:16px}
.kpis.flat{gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.flat .kpi{border:0;border-radius:0;box-shadow:none;border-left:1px solid var(--line)}
.kpis.flat .kpi:first-child{border-left:0}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;height:300px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .axis text{fill:var(--ink-3);font-size:11px;font-family:var(--f-ui)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font-size:12.5px;box-shadow:var(--shadow-lg);min-width:190px;z-index:5}
.tip .t{font-weight:650;margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center;line-height:1.7}
.tip .r span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.sw{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);padding:0 20px 18px}
.legend button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:inherit;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.4}
.donut-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center}
.donut-wrap > div:last-child{width:100%}
#ch-main,.cv-chart{height:440px}
.donut{position:relative;width:180px;height:180px}
.donut svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.donut path{transition:opacity .15s}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .center b{font-size:18px;letter-spacing:-.02em}
.donut .center span{font-size:11.5px;color:var(--ink-3)}

/* ---------- category chip ---------- */
.cat-ic{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;flex:none;color:var(--cc);background:color-mix(in srgb, var(--cc) 14%, transparent)}
.cat-ic .ic{width:15px;height:15px}
.cat-ic.sm{width:22px;height:22px;border-radius:7px} .cat-ic.sm .ic{width:13px;height:13px}

/* ---------- lists ---------- */
.alloc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.alloc-row:first-child{border-top:0}
.alloc-row .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-row .val{text-align:right;font-weight:600}
.alloc-row .meta{grid-column:2/4;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.alloc-row.dim{opacity:.35}
.pos-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.pos-row:first-child{border-top:0}
.pos-row .nm{font-weight:550;display:flex;align-items:center;gap:10px;min-width:0}
.pos-row .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-row .sub2{font-size:12px;color:var(--ink-3)}
.pos-row .r{text-align:right;font-weight:600}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar-fill.neg{background:var(--neg)}
.struct{display:grid;gap:10px}
.struct .r{display:flex;justify-content:space-between;gap:12px}
.struct .r.total{border-top:1px solid var(--line-2);padding-top:10px;font-weight:700}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--brand);border-radius:4px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;background:var(--surface)}
tbody tr:hover td{background:color-mix(in srgb, var(--surface-2) 60%, transparent)}
td.n,th.n{text-align:right}
tr.cat td{font-weight:650;background:var(--surface-2)}
tr.total td{font-weight:700;border-top:1px solid var(--line-2);border-bottom:0}
tr.acc td:first-child{padding-left:44px;color:var(--ink-2)}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.matrix tr.cat td:first-child{background:var(--surface-2)}
.matrix th .hd{display:grid;gap:3px;justify-items:end}
.toggle{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:650}
.toggle .chev{width:14px;height:14px;transition:transform .15s}
.toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.cell-in{width:90px;text-align:right}
.scan{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:16%;border:3px solid #34D399;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-2)}
.inl{display:inline-flex;gap:10px;align-items:center}

/* ---------- valuation ---------- */
.val-head{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:14px;align-items:end}
.val-group{overflow:hidden}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;cursor:pointer;user-select:none}
.gh .l{display:flex;align-items:center;gap:10px;font-weight:650;min-width:0}
.gh .r{display:flex;align-items:center;gap:12px}
.gh .chev{width:15px;height:15px;transition:transform .15s;color:var(--ink-3)}
.gh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.vrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(90px,.7fr) minmax(150px,1fr) minmax(90px,.6fr);gap:12px;align-items:center;padding:9px 20px;border-top:1px solid var(--line)}
.vrow .nm{min-width:0}
.vrow .nm b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .nm small{color:var(--ink-3);font-size:12px;display:block}
.vrow .prev{text-align:right;color:var(--ink-3)}
.vrow .delta{text-align:right;font-size:13px;font-weight:550}
.vrow input.n{text-align:right}
.vrow-h{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:6px;padding-bottom:6px}
.savebar{position:sticky;bottom:0;z-index:20;padding-bottom:max(12px, env(safe-area-inset-bottom,0px))}
.savebar .in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow-lg)}
.savebar .tot{font-size:22px;font-weight:700;letter-spacing:-.02em}
.msg{padding:11px 14px;border-radius:var(--r-s);background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.msg.info{background:var(--surface-2);color:var(--ink-2)}
.msg-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- accounts & holdings ---------- */
.acc-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.acc-row:hover{background:var(--surface-2)}
.acc-row.arch{opacity:.55}
.acc-row .nm{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.h-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(70px,.6fr) minmax(80px,.7fr) minmax(64px,.5fr) minmax(90px,.8fr);gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.h-row:hover{background:var(--surface-2)}
.h-row.h{cursor:default;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:7px;padding-bottom:7px}
.h-row.h:hover{background:none}
.h-row .nm{min-width:0}
.h-row .nm b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-row .nm small{color:var(--ink-3);font-size:12px}
.h-row > span:not(.nm){text-align:right}
.type-badge{font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;margin-right:6px}
.logo{position:relative;width:26px;height:26px;border-radius:8px;flex:none;display:inline-grid;place-items:center;overflow:hidden;background:var(--surface-2);color:var(--ink-2);font-size:10px;font-weight:700;letter-spacing:-.02em;box-shadow:inset 0 0 0 1px var(--line);vertical-align:middle}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.logo img,.type-ic.brand img,.lf-ic img{opacity:0;transition:opacity .15s}
.logo img.ok,.type-ic.brand img.ok,.lf-ic img.ok{opacity:1}
.logo.round{border-radius:50%}
.logo.lg{width:32px;height:32px;font-size:11.5px;border-radius:10px}
.logo.sm{width:22px;height:22px;font-size:9px;border-radius:7px}
.logo svg{width:62%;height:62%}
.logo.metal{background:none;box-shadow:none} .logo.metal svg{width:100%;height:100%}
.with-logo{display:flex;align-items:center;gap:10px;min-width:0}
.with-logo > span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line-2);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:var(--shadow-lg)}
dialog.wide{width:min(840px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(11,15,26,.55);backdrop-filter:blur(2px)}
.dlg-h{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-b{padding:16px 22px;display:grid;gap:14px}
.dlg-f{padding:0 22px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dlg-f .r{display:flex;gap:8px;margin-left:auto}
.results{border:1px solid var(--line);border-radius:var(--r-s);max-height:260px;overflow:auto}
.results button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover{background:var(--surface-2)}
.results small{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row4 label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{display:flex;align-items:center;gap:8px}
.check input{accent-color:var(--brand);width:16px;height:16px}

/* ---------- feedback ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-weight:550;z-index:100;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;z-index:90;pointer-events:none}
.celebrate .box{display:grid;justify-items:center;gap:4px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:18px 28px 22px;box-shadow:var(--shadow-lg);animation:pop .25s ease-out}
.celebrate .anim{width:120px;height:120px}
.celebrate .fx{position:fixed;inset:0;pointer-events:none}
.celebrate b{font-size:17px}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.spark{display:block}
.hint{font-size:12.5px;color:var(--ink-3)}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* ---------- income ---------- */
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{min-width:150px;text-align:center;font-size:15px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.type-ic{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;flex:none;color:var(--tc);background:color-mix(in srgb, var(--tc) 14%, transparent)}
.type-ic .ic{width:15px;height:15px}
.codes{display:flex;gap:4px;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.calc{display:grid;gap:6px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface-2)}
.calc .r{display:flex;justify-content:space-between;gap:12px}
.calc .r.total{border-top:1px solid var(--line-2);padding-top:6px;font-weight:700}
.bars svg{display:block;width:100%;height:100%}
.type-ic.brand,.lf-ic{position:relative;overflow:hidden}
.type-ic.brand img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px;border-radius:inherit}
.lf-ic{display:inline-grid;place-items:center;width:18px;height:18px;flex:none;border-radius:5px}
.lf-ic .ic{width:16px;height:16px}
.lf-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:5px}
.tabbar .lf-ic{width:20px;height:20px}
/* fast entry */
.src-chip{gap:6px;height:32px;padding:0 10px 0 4px}
.src-chip .logo{width:22px;height:22px}
.src-chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.month-rows{display:grid;gap:6px}
.m-row{display:grid;grid-template-columns:minmax(0,1fr) auto 140px;gap:12px;align-items:center;padding:4px 0}
.m-row.is-done{opacity:.6}
.m-row input.n{text-align:right}
.link-btn{background:none;border:0;padding:0;color:var(--brand-ink);cursor:pointer;font:inherit;font-size:12.5px}
.link-btn:hover{text-decoration:underline}
@media (max-width: 760px){ .m-row{grid-template-columns:minmax(0,1fr) 120px} .m-row .hint{grid-column:1/-1;order:3;margin-top:-4px} }
/* app lock */
.lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#0B0F1A;color:#F1F5F9;padding:max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom))}
.lock-box{display:grid;justify-items:center;gap:16px;text-align:center;max-width:320px;width:100%}
.lock-box h2{font-size:20px;color:#F1F5F9}
.lock-box .btn{min-width:220px}
.lock-pin{display:flex;gap:8px;width:100%;max-width:240px}
.lock-pin .input{background:#121826;border-color:#2F3B52;color:#F1F5F9;text-align:center;letter-spacing:.3em}
.lock .link-btn{color:#34D399}
.lock .hint{color:#A9B4C6;min-height:1.4em}
body.locked{overflow:hidden}
/* quick search */
.search-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 14px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-3);font-size:13px;cursor:pointer}
.search-btn:hover{border-color:var(--line-2);color:var(--ink-2)}
kbd{font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
dialog.palette{width:min(640px,calc(100vw - 32px));margin-top:12vh;margin-bottom:auto}
.search-field{display:flex;align-items:center;gap:10px;padding:0 4px}
.search-field .ic{color:var(--ink-3)}
.search-field .input{border:0;box-shadow:none;font-size:17px;padding:0;height:44px;background:transparent}
.search-field .input:focus{box-shadow:none}
.q-res{max-height:min(60vh,520px);overflow:auto;padding:0 8px 10px;border-top:1px solid var(--line)}
.q-group{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px}
.q-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;color:inherit}
.q-item[aria-selected="true"]{background:var(--brand-soft)}
.q-ic{width:28px;height:28px;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.q-ic .ic{width:17px;height:17px}
.q-txt{display:grid;min-width:0}
.q-txt b{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-txt small{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width: 760px){ dialog.palette{margin:auto 0 0;width:100%} .search-field kbd{display:none} }
/* combobox */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);box-shadow:var(--shadow-lg);max-height:280px;overflow:auto;padding:4px}
.combo-list button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}
.combo-list button[aria-selected="true"],.combo-list button:hover{background:var(--surface-2)}
.combo-list small{color:var(--ink-3)}
.combo-list .add{color:var(--brand-ink);font-weight:600}
.code.paid{background:var(--pos-bg);color:var(--pos);border-color:transparent;text-decoration:line-through}
.p-row{display:grid;grid-template-columns:92px minmax(0,1fr) 110px 30px;gap:8px;align-items:center}
.p-owes{text-align:right;font-size:12.5px}
.msg-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s)}
.msg-line.is-paid{opacity:.55}
.msg-line.is-paid .msg-text{text-decoration:line-through}
.msg-text{overflow-wrap:anywhere}
.debt{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.debt:first-child{border-top:0;padding-top:0}
.debt-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-s);display:grid;gap:2px;min-width:0}
.stat b{font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width: 760px){ .p-row{grid-template-columns:80px minmax(0,1fr) 36px} .p-row [data-rm]{order:3} .p-row .p-owes{order:4;grid-column:1/-1;text-align:left;margin-top:-4px} .row3.nums{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .row3.nums label{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row4{grid-template-columns:1fr 1fr;gap:10px} .stat-grid{grid-template-columns:1fr 1fr} .msg-line{grid-template-columns:auto minmax(0,1fr)} .msg-line .btn{grid-column:1/-1} }

/* ---------- responsive ---------- */
@media (max-width: 1080px){
  .grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.flat .kpi:nth-child(3){border-left:0}
  .kpis.flat .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
  main{padding-block:16px 100px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);border-top:1px solid var(--line);padding:6px max(4px, env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px, env(safe-area-inset-right,0px));justify-content:space-around}
  .tabbar a{display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:550;color:var(--ink-3);text-decoration:none;padding:5px 2px;border-radius:10px;min-width:0;flex:1}
  .tabbar a[aria-current="page"]{color:var(--nav-active-ink);background:var(--nav-active)}
  .tabbar .ic{width:20px;height:20px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .kpis{gap:10px}
  .kpis.three{grid-template-columns:minmax(0,1fr)}
  .kpi{padding:14px}
  .kpi .v{font-size:18px}
  .chart{height:240px}
  #ch-main,.cv-chart{height:250px}
  .val-head{grid-template-columns:minmax(0,1fr)}
  .vrow{grid-template-columns:minmax(0,1fr) minmax(130px,1fr);padding:10px 14px}
  .vrow .prev,.vrow .delta,.vrow-h{display:none}
  .acc-row{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .acc-row .hide-sm{display:none}
  .h-row{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .h-row > .hide-sm{display:none}
  .savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .row2,.row3{grid-template-columns:1fr}
  .bar-row{grid-template-columns:minmax(0,120px) minmax(0,1fr) auto}
  .card-h{padding:16px 16px 0} .card-b{padding:14px 16px 16px} .gh{padding:13px 16px}
}
/* ---------- iPhone / touch ---------- */
html{-webkit-text-size-adjust:100%}
button,a,input,select,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (max-width: 760px){
  /* status bar area (Dynamic Island) when installed on the home screen */
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0B0F1A;z-index:40}
  main{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  /* 16px text in fields stops iOS from zooming in on focus */
  .input,.input.sm,select.input,textarea.input{font-size:16px}
  .input{height:44px}
  .input.sm{height:38px}
  .btn{height:44px}
  .btn.sm{height:36px}
  .btn.icon{width:44px} .btn.sm.icon{width:36px}
  .seg button{height:34px}
  .p-row input,.m-row input{height:44px}
  /* dialogs become bottom sheets */
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;border-bottom:0;max-height:92dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog[open]{animation:sheet .26s cubic-bezier(.2,.8,.2,1)}
  dialog .dlg-h{touch-action:none}
  dialog.wide{width:100%}
  dialog .dlg-h{position:sticky;top:0;background:var(--surface);z-index:2;padding-top:18px}
  dialog .dlg-h::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:5px;border-radius:3px;background:var(--line-2);transform:translateX(-50%)}
  dialog .dlg-f{position:sticky;bottom:0;background:var(--surface);padding-top:12px;border-top:1px solid var(--line);z-index:2}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .hero-total{font-size:42px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
/* ---------- motion ---------- */
#view.enter{animation:viewIn .24s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chart path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
dialog[open]{animation:dlgIn .18s cubic-bezier(.2,.7,.2,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
dialog[open]::backdrop{animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{animation:toastIn .22s cubic-bezier(.2,.7,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.btn:active:not(:disabled),.seg button:active,.tabbar a:active,.nav a:active,.src-chip:active{transform:scale(.97)}
.btn,.seg button,.tabbar a,.nav a{transition:background .12s,border-color .12s,box-shadow .12s,transform .08s}
.card,.kpi{transition:border-color .15s,box-shadow .15s}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

};

/* ================= Data layer ================= */
let DB = null;
let MODE = "local";   // "server" (lokaler Python-Server) | "local" (nur Browser, z. B. GitHub Pages)
const LS_KEY = "vermoegen-data-v1";
let saveTimer = null;
const DEFAULT_CATS = [["liquiditaet","Konten & Tagesgeld"],["wertpapiere","Aktien & ETFs"],["edelmetalle","Edelmetalle & Rohstoffe"],["krypto","Krypto"],["bargeld","Bargeld"],["guthaben","Guthaben & Gutscheine"],["sachwerte","Sachwerte"],["kredite","Kreditkarten & Kredite"]];
const emptyDB = () => ({version: 2, currency: "EUR", categories: DEFAULT_CATS.map(([key, label]) => ({key, label})), accounts: [], snapshots: [], plan: {}, lastQuotes: {}});

async function loadData() {
  if (location.protocol.startsWith("http") && /^(localhost|127\.)/.test(location.hostname)) {
    try { const r = await fetch("api/ping", {cache: "no-store"}); if (r.ok && (await r.json()).ok) MODE = "server"; } catch {}
  }
  if (MODE === "server") { const r = await fetch("api/data", {cache: "no-store"}); DB = await r.json(); }
  else DB = store.get(LS_KEY, null) || (window.SEED ? JSON.parse(JSON.stringify(window.SEED)) : null);
  if (!DB) DB = emptyDB();
  migrate();
  setStoreStatus();
}
/** Brings older data files (version 1) to the current shape and fills defaults. */
function migrate() {
  DB.categories ||= emptyDB().categories; DB.accounts ||= []; DB.snapshots ||= []; DB.lastQuotes ||= {};
  DB.accounts.forEach(a => {
    a.holdings ||= [];
    if ((a.kind === "stock" || a.kind === "crypto") && a.symbol && !a.holdings.length) a.holdings.push({id: "h" + uid(), type: a.kind, symbol: a.symbol, name: a.symbol, qty: a.qty || 0});
    delete a.kind; delete a.symbol; delete a.qty;
    a.provider ||= a.name;
  });
  DB.snapshots.forEach(s => {
    s.values ||= {}; s.detail ||= {}; s.id ||= "s" + uid();
    if (s.quotes) { Object.entries(s.quotes).forEach(([id, q]) => { if (q && q.qty != null) s.detail[id] = {items: [{type: "crypto", qty: q.qty, price: q.price}]}; }); delete s.quotes; }
  });
  DB.snapshots.sort((a, b) => a.date.localeCompare(b.date));
  const p = DB.plan ||= {};
  p.targets ||= {}; p.milestones ||= [100000, 250000, 500000, 1000000]; p.forecast ||= {}; p.years ||= 15;
  p.budget ||= {income: 0, expenses: 0}; p.cashflows ||= [];
  const inc = DB.income ||= {};
  inc.entries ||= []; inc.orders ||= []; inc.deals ||= []; inc.settings ||= {};
  if (inc.settings.discount == null) inc.settings.discount = 0.1;
  if (inc.settings.serviceRate == null) inc.settings.serviceRate = 0.025;
  if (inc.settings.serviceCap == null) inc.settings.serviceCap = 0.89;
  inc.settings.employer ??= "";
  inc.settings.sourceDomains ||= {};
  inc.settings.sources ||= {}; inc.settings.sources.cashback ||= []; inc.settings.sources.zinsen ||= []; inc.settings.sources.sonstiges ||= [];
  DB.version = 2;
}
/** quiet: store locally only (e.g. refreshed prices), do not trigger a sync. */
function save(immediate, quiet) {
  clearTimeout(saveTimer); TOT_CACHE = new WeakMap();
  DB.snapshots.sort((a, b) => a.date.localeCompare(b.date));
  const run = async () => {
    if (MODE === "server") {
      try { const r = await fetch("api/data", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(DB)}); if (!r.ok) throw 0; setStoreStatus(); }
      catch { setStoreStatus("Speichern fehlgeschlagen. Läuft der Server noch?"); }
    } else { try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); setStoreStatus(); } catch { setStoreStatus("Speichern im Browser nicht möglich. Bitte Backup herunterladen."); } }
    if (!applyingRemote && !quiet) Sync.changed();
  };
  immediate ? run() : (saveTimer = setTimeout(run, 300));
}
function backupDue() {
  if (MODE === "server" || !DB?.snapshots.length) return false;
  if (Sync.on() && Sync.state.lastSyncAt && Date.now() - new Date(Sync.state.lastSyncAt) < 14 * 864e5) return false;
  const b = store.get("last-backup", null);
  return !b || Date.now() - new Date(b) > 30 * 864e5;
}
function setStoreStatus(err) {
  const dot = $("#st-store-dot"), t = $("#st-store");
  if (err) { dot.className = "dot warn"; t.textContent = err; return; }
  if (MODE === "server") { dot.className = "dot ok"; t.textContent = "Gespeichert in data.json"; return; }
  const b = store.get("last-backup", null);
  dot.className = backupDue() ? "dot warn" : "dot ok";
  t.textContent = "Gespeichert in diesem Browser" + (b ? ` · Backup ${new Date(b).toLocaleDateString(LOCALE)}` : " · noch kein Backup");
}

/* ================= Sync between devices =================
   Data is encrypted on the device (AES-256-GCM, key derived from your password with PBKDF2) and stored as a
   single file in a secret GitHub Gist of your own account. GitHub only ever sees ciphertext.
   Every device keeps its own copy; changes are pushed a few seconds after saving and pulled on start,
   when the app comes back to the foreground and every two minutes. */
let applyingRemote = false;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
const deviceName = () => { const u = navigator.userAgent; return /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows-PC" : "Gerät"; };
const Sync = {
  KEY: "tracky-sync",
  state: store.get("tracky-sync", null) || {},
  key: null, timer: null, busy: false,
  on() { return !!(this.state.token && this.state.gistId && this.state.keyJwk); },
  persist() { store.set(this.KEY, this.state); },
  async importKey() { if (!this.key && this.state.keyJwk) this.key = await crypto.subtle.importKey("jwk", this.state.keyJwk, {name: "AES-GCM"}, true, ["encrypt", "decrypt"]); return this.key; },
  async derive(pass, saltB64) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt: unb64(saltB64), iterations: 310000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["encrypt", "decrypt"]);
  },
  async seal(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12)), key = await this.importKey();
    const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
    return JSON.stringify({app: "tracky", v: 1, salt: this.state.salt, iv: b64(iv), ct: b64(ct), savedAt: new Date().toISOString(), device: deviceName()});
  },
  async open(file, key) {
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(file.iv)}, key || await this.importKey(), unb64(file.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
  async api(path, opts = {}, token) {
    let r; try { r = await fetch("https://api.github.com" + path, {...opts, cache: "no-store", headers: {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + (token || this.state.token), ...(opts.body ? {"Content-Type": "application/json"} : {})}}); }
    catch { throw new Error("Keine Verbindung zu GitHub. Bitte Internetverbindung prüfen."); }
    if (r.status === 401) throw new Error("Der GitHub-Token ist ungültig, abgelaufen oder wurde gelöscht. Erstelle am Laptop einen neuen Token und einen neuen Verbindungscode.");
    if (r.status === 403) throw new Error("GitHub verweigert den Zugriff. Hat der Token das Recht „gist“?");
    if (r.status === 404) throw new Error("Der Sync-Speicher wurde nicht gefunden.");
    if (!r.ok) throw new Error("GitHub antwortet nicht (" + r.status + ").");
    return r.json();
  },
  async readGist(id, token) {
    const g = await this.api("/gists/" + id, {}, token), f = g.files?.["tracky.json"];
    if (!f) throw new Error("In diesem Gist liegen keine Tracky-Daten.");
    const content = f.truncated ? await (await fetch(f.raw_url, {cache: "no-store"})).text() : f.content;
    return {file: JSON.parse(content), updatedAt: g.updated_at};
  },
  status(kind, text) {
    const row = $("#st-sync-row"); if (!row) return;
    row.hidden = !this.on() && !text;
    $("#st-sync-dot").className = "dot " + (kind || "");
    $("#st-sync").textContent = text || "";
    $("#sync-state") && (($("#sync-state").innerHTML = text ? `<span class="dot ${kind || ""}" style="display:inline-block;margin:0 6px 1px 0"></span>${esc(text)}` : ""));
  },
  showOk() { this.status("ok", "Synchronisiert " + (this.state.lastSyncAt ? new Date(this.state.lastSyncAt).toLocaleTimeString(LOCALE, {hour: "2-digit", minute: "2-digit"}) : "")); },
  /** First device: create the gist with the current data. */
  async create(token, pass) {
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    const key = await this.derive(pass, salt);
    this.key = key; this.state = {token, salt, keyJwk: await crypto.subtle.exportKey("jwk", key)};
    const g = await this.api("/gists", {method: "POST", body: JSON.stringify({description: "Tracky – verschlüsselte Daten (nicht löschen)", public: false, files: {"tracky.json": {content: await this.seal(DB)}}})}, token);
    Object.assign(this.state, {gistId: g.id, lastRemote: g.updated_at, lastSyncAt: new Date().toISOString(), dirty: false});
    this.persist(); this.showOk();
  },
  /** Further device: connect to an existing gist. Returns the remote data so the caller can decide. */
  async connect(token, gistId, pass) {
    const {file, updatedAt} = await this.readGist(gistId, token);
    const key = await this.derive(pass, file.salt);
    let data; try { data = await this.open(file, key); } catch { throw new Error("Das Passwort passt nicht zu diesen Daten."); }
    this.key = key; this.state = {token, gistId, salt: file.salt, keyJwk: await crypto.subtle.exportKey("jwk", key), lastRemote: updatedAt, dirty: false};
    this.persist();
    return {data, file};
  },
  disconnect() { this.state = {}; this.key = null; store.set(this.KEY, null); this.status("", ""); },
  changed() { if (!this.on()) return; this.state.dirty = true; this.state.localChangedAt = new Date().toISOString(); this.persist(); this.status("", "Änderungen werden synchronisiert …"); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 2500); },
  async push(force) {
    if (!this.on() || this.busy) return; this.busy = true;
    try {
      if (!force) {
        const g = await this.api("/gists/" + this.state.gistId);
        if (g.updated_at !== this.state.lastRemote) { this.busy = false; return this.pull(true); }
      }
      const g = await this.api("/gists/" + this.state.gistId, {method: "PATCH", body: JSON.stringify({files: {"tracky.json": {content: await this.seal(DB)}}})});
      Object.assign(this.state, {lastRemote: g.updated_at, lastSyncAt: new Date().toISOString(), dirty: false}); this.persist(); this.showOk(); setStoreStatus();
    } catch (e) { this.status("warn", "Sync fehlgeschlagen: " + e.message); }
    this.busy = false;
  },
  async pull(fromPush) {
    if (!this.on() || this.busy) return; this.busy = true;
    try {
      const {file, updatedAt} = await this.readGist(this.state.gistId);
      if (updatedAt === this.state.lastRemote) { this.busy = false; if (this.state.dirty) return this.push(); this.showOk(); return; }
      const data = await this.open(file);
      if (this.state.dirty) { this.busy = false; return this.conflict(data, file, updatedAt); }
      this.apply(data, updatedAt);
      toast(`Neuer Stand von ${file.device || "einem anderen Gerät"} übernommen`);
    } catch (e) { this.status("warn", "Sync fehlgeschlagen: " + e.message); }
    this.busy = false;
  },
  apply(data, updatedAt) {
    applyingRemote = true;
    DB = data; migrate(); TOT_CACHE = new WeakMap(); try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch {}
    applyingRemote = false;
    Object.assign(this.state, {lastRemote: updatedAt, lastSyncAt: new Date().toISOString(), dirty: false}); this.persist(); this.showOk();
    if (!dlg.open) go();
  },
  conflict(data, file, updatedAt) {
    const when = d => d ? new Date(d).toLocaleString(LOCALE, {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "–";
    openDlg(`<div class="dlg-h"><h2>Zwei verschiedene Stände</h2></div>
      <div class="dlg-b"><p class="sub" style="margin:0">Auf diesem Gerät und auf ${esc(file.device || "einem anderen Gerät")} wurde seit dem letzten Sync etwas geändert. Welcher Stand soll gelten? Der andere wird überschrieben.</p>
        <div class="struct"><div class="r"><span>Dieses Gerät (${esc(deviceName())})</span><span class="num">geändert ${when(this.state.localChangedAt)}</span></div>

/* ================= App lock (Face ID / Touch ID / Windows Hello via WebAuthn, PIN as fallback) =================
   A local gate in front of the app: the device's platform authenticator confirms it is you.
   The data itself stays as it is on the device; the lock keeps people out who pick up the unlocked phone. */
const Lock = {
  KEY: "tracky-lock",
  get cfg() { return store.get(this.KEY, null); },
  set cfg(v) { store.set(this.KEY, v); },
  on() { const c = this.cfg; return !!(c && (c.credId || c.pinHash)); },
  async supported() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch { return false; } },
  async pinHash(pin, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
    return b64(await crypto.subtle.deriveBits({name: "PBKDF2", salt: unb64(salt), iterations: 200000, hash: "SHA-256"}, base, 256));
  },
  /** Websites may use Face ID / Touch ID only through a passkey (WebAuthn). It is named so it is easy to recognise in the Passwords app. */
  async createPasskey() {
    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: "Tracky App-Sperre"},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: "Tracky App-Sperre", displayName: "Tracky App-Sperre"},
      pubKeyCredParams: [{type: "public-key", alg: -7}, {type: "public-key", alg: -257}],
      authenticatorSelection: {authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged"}, timeout: 60000}});
    return b64(cred.rawId);
  },
  async enable(pin, after, useBio = true) {
    const credId = useBio && await this.supported() ? await this.createPasskey() : null;
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    this.cfg = {credId, salt, pinHash: await this.pinHash(pin, salt), after};
  },
  disable() { this.cfg = null; },
  show(auto = false) {
    if (!this.on()) return;
    if (dlg.open) dlg.close();
    const c = this.cfg, el = $("#lock");
    el.hidden = false; document.body.classList.add("locked");
    $("#lock-bio").hidden = !c.credId; $("#lock-bio").innerHTML = `${I.lockIc} ${/Mac|iPhone|iPad/.test(navigator.userAgent) ? (/iPhone|iPad/.test(navigator.userAgent) ? "Mit Face ID entsperren" : "Mit Touch ID entsperren") : "Entsperren"}`;
    $("#lock-pinf").hidden = !!c.credId; $("#lock-usepin").hidden = !c.credId; $("#lock-msg").textContent = "";
    if (!c.credId) $("#lock-pin").focus();
    else if (auto) this.bio(true);
  },
  hide() { $("#lock").hidden = true; document.body.classList.remove("locked"); store.set("tracky-unlocked-at", Date.now()); },
  async bio(auto = false) {
    const c = this.cfg, msg = $("#lock-msg");
    if (this.busy) return; this.busy = true;
    try {
      await navigator.credentials.get({publicKey: {challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{type: "public-key", id: unb64(c.credId)}], userVerification: "required", timeout: 60000}});
      this.hide();
    } catch (e) {
      /* An automatic attempt may be refused by the browser (no tap yet) – then the button simply stays. */
      if (!auto) msg.textContent = e?.name === "NotAllowedError" ? "Abgebrochen. Nochmal versuchen oder PIN verwenden." : "Entsperren nicht möglich. Bitte PIN verwenden.";
    } finally { this.busy = false; }
  },
  async pin(pin) {
    const c = this.cfg;
    if (await this.pinHash(pin, c.salt) === c.pinHash) { this.hide(); return true; }
    $("#lock-msg").textContent = "Falsche PIN."; $("#lock-pin").value = ""; $("#lock-pin").focus(); return false;
  },
  init() {
    $("#lock-bio").onclick = () => this.bio();
    $("#lock-usepin").onclick = () => { $("#lock-pinf").hidden = false; $("#lock-usepin").hidden = true; $("#lock-pin").focus(); };
    $("#lock-pinf").onsubmit = e => { e.preventDefault(); this.pin($("#lock-pin").value); };
    let hiddenAt = null;
    document.addEventListener("visibilitychange", () => {
      if (!this.on()) return;
      if (document.visibilityState === "hidden") hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > (this.cfg.after ?? 60) * 1000) this.show(true);
    });
    if (this.on()) this.show(true); else $("#lock").hidden = true;
  },
};

function niceTicks(min, max, count = 5) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / count, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const t = []; for (let v = Math.floor(min / step) * step; v <= Math.ceil(max / step) * step + step / 2; v += step) t.push(Math.round(v / step) * step);
  return t;
}
function timeTicks(x0, x1, maxTicks) {
  const months = (x1.getFullYear() - x0.getFullYear()) * 12 + x1.getMonth() - x0.getMonth();
  const stepM = [1, 2, 3, 6, 12, 24, 36, 60].find(s => months / s <= maxTicks) || 120;
  const t = []; let d = new Date(x0.getFullYear(), Math.ceil(x0.getMonth() / stepM) * stepM, 1);
  if (stepM >= 12) d = new Date(Math.ceil((x0.getFullYear() + (x0.getMonth() ? 1 : 0)) / (stepM / 12)) * (stepM / 12), 0, 1);
  while (d < x0) d = new Date(d.getFullYear(), d.getMonth() + stepM, 1);
  while (d <= x1) { t.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth() + stepM, 1); }
  return {t, yearly: stepM >= 12};
}

      lineChart($("#ch-main"), {dates, series: series.length ? series : [{label: "–", color: "var(--ink-3)", values: sub.map(() => 0)}]});
    }
  };
  $$("#seg-mode button").forEach(b => b.onclick = () => { mode = b.dataset.v; store.set("ov-mode", mode); draw(); });
  $$("#seg-range button").forEach(b => b.onclick = () => { range = b.dataset.v; store.set("ov-range", range); draw(); });
  draw(); resizeFns.push(draw);

  const paintLive = () => {
    const est = liveEstimate(), el = $("#live-chip"); if (!el) return;
    if (!est) { el.innerHTML = ""; return; }
    const lt = total({values: est.values});
    el.innerHTML = `<span class="chip live ${cls(lt - tot)}" title="Letzte Bewertung, ${est.n} Konto/Konten mit aktuellen Kursen neu bewertet">Heute live ${eur0(lt)} (${sEur0(lt - tot)})</span>`;
  };
  paintLive(); onQuotes = paintLive;
  $("#btn-q")?.addEventListener("click", () => refreshQuotes(false));
  if (!countedUp && !reduced() && !PRIV) {
    countedUp = true;
    const el = $(".hero-total"), t0 = performance.now(), from = tot * .96;
    const step = t => { const k = Math.min(1, (t - t0) / 650), e = 1 - Math.pow(1 - k, 3), [w, c] = eur(from + (tot - from) * e).split(",");
      if (el.isConnected) el.innerHTML = `${esc(w)}<span class="cents">,${esc(c)}</span>`; if (k < 1) requestAnimationFrame(step); };

};

const kpi = (l, val, d, icon) => `<div class="kpi"><div class="kh">${icon ? `<span class="kic">${icon}</span>` : ""}<span class="eyebrow">${l}</span></div><div class="v num">${val}</div><div class="d num">${d}</div></div>`;

/* ================= View: Bewertung ================= */
VIEWS.bewertung = v => {
  const editing = editId ? DB.snapshots.find(s => s.id === editId) : null;
  const base = editing ? DB.snapshots[DB.snapshots.indexOf(editing) - 1] : latest();
  const draft = editing ? {date: editing.date, note: editing.note || "", values: {...editing.values}, detail: JSON.parse(JSON.stringify(editing.detail || {}))} : {date: todayISO(), note: "", values: {}, detail: {}};
  const accounts = DB.accounts.filter(a => !a.archived || (editing && editing.values[a.id] != null));
  const liveFill = a => {
    const l = accLive(a); if (!l) return false;
    draft.values[a.id] = l.value;
    draft.detail[a.id] = {items: a.holdings.map(h => { const x = hVal(h); return {type: h.type, symbol: h.symbol || h.chain, qty: x.qty, price: x.price}; })};
    return true;
  };
  if (!editing) accounts.forEach(a => { if (!(isLive(a) && liveFill(a))) draft.values[a.id] = base?.values[a.id] ?? 0; });
  const open = new Set(store.get("val-open", DB.categories.map(c => c.key)));
  v.innerHTML = `
    <div class="head"><div><h1>${editing ? "Bewertung bearbeiten" : "Neue Bewertung"}</h1>
      <p>${editing ? `Stichtag ${fmtDateL(editing.date)}.` : base ? `Alle Werte sind mit dem Stand vom ${fmtDate(base.date)} vorausgefüllt. Konten mit Depot-Positionen werden mit aktuellen Kursen berechnet. Ändere nur, was sich bewegt hat.` : "Trage für jedes Konto den aktuellen Wert ein."}</p></div>
      <div class="actions">
        ${allHoldings().length ? `<button class="btn" type="button" id="v-q" data-refresh>${I.refresh} Kurse laden</button>` : ""}
        <button class="btn" type="button" id="v-add">${I.plus} Konto hinzufügen</button>
      </div>
    </div>
    <div class="card"><div class="card-b val-head">
      <div class="field"><label for="v-date">Stichtag</label><input class="input" type="date" id="v-date" value="${draft.date}"></div>
      <div class="field"><label for="v-note">Notiz (optional)</label><input class="input" id="v-note" value="${esc(draft.note)}" placeholder="z. B. nach Bonuszahlung"></div>
      <div class="field"><span class="lbl">&nbsp;</span><span class="hint">Rechnen wie in Excel, z. B. <span class="num">629*4,69</span></span></div>
    </div></div>
    <div id="v-msg">${(() => { const o = openDebts().reduce((t, d) => t + d.sum, 0); return o > 0 ? `<div class="msg info msg-row"><span>Kollegen schulden dir noch <b class="num">${eur(o)}</b> aus Lieferando-Bestellungen. Das Geld ist schon von deinem Lieferando-Guthaben abgegangen.</span><a class="btn sm" href="#lieferando">Ansehen</a></div>` : ""; })()}</div>
    <div id="groups" style="display:grid;gap:14px"></div>
    <div class="savebar"><div class="in">
      <div><div class="eyebrow">Summe</div><div class="tot num" id="v-tot"></div></div>
      <div id="v-delta" class="num"></div>
      <div class="actions" style="margin-left:auto">
        ${editing ? `<button class="btn danger" type="button" id="v-del">Löschen</button><a class="btn" href="#verlauf">Abbrechen</a>` : ""}
        <button class="btn primary" type="button" id="v-save">${editing ? "Änderungen speichern" : "Bewertung speichern"}</button>
      </div>
    </div></div>`;
  const groups = $("#groups");
  const vrow = a => {
    const prev = base?.values[a.id], live = isLive(a), l = live ? accLive(a) : null;
    const gap = live && l && prev > 0 && l.value < prev * .7;
    return `<div class="vrow"><span class="nm with-logo">${accLogo(a)}<span><b>${esc(a.name)}</b>${live ? `<small>${a.holdings.length} Position${a.holdings.length > 1 ? "en" : ""} · ${l?.fresh ? '<span class="pos">Live-Kurs</span>' : l ? "letzter bekannter Kurs" : "kein Kurs"}${gap ? ' · <span class="neg">deutlich weniger als zuletzt, fehlen Positionen?</span>' : ""}</small>` : ""}</span></span>
      <span class="prev num">${prev != null ? eur(prev) : "–"}</span>
      <input class="input n" inputmode="decimal" data-acc="${a.id}" aria-label="Wert ${esc(a.name)}" value="${fmtN.format(draft.values[a.id] ?? 0)}">
      <span class="delta num" data-delta="${a.id}"></span></div>`;
  };
  const renderGroups = () => {
    groups.innerHTML = DB.categories.map(c => {
      const list = accounts.filter(a => a.cat === c.key); if (!list.length) return "";
      const o = open.has(c.key);
      return `<div class="card val-group" data-cat="${c.key}">
        <div class="gh" role="button" tabindex="0" aria-expanded="${o}"><span class="l">${I.chev}${catChip(c.key)}${esc(c.label)} <span class="muted" style="font-weight:400">${list.length}</span></span>
          <span class="r"><span class="num" data-cat-delta style="font-size:13px"></span><b class="num" data-cat-sum></b></span></div>
        <div class="gb" ${o ? "" : "hidden"}>

    $$("input[data-acc]", groups).forEach(inp => {
      inp.addEventListener("input", () => {
        const n = parseNum(inp.value); inp.setAttribute("aria-invalid", Number.isNaN(n));

    (only ? [only] : accounts.map(a => a.id)).forEach(id => { const el = $(`[data-delta="${id}"]`, groups); if (!el) return; const d = (draft.values[id] || 0) - (base?.values[id] || 0); el.className = "delta num " + cls(d); el.textContent = Math.abs(d) < .005 ? "–" : sEur(d); });
    DB.categories.forEach(c => {
      const g = $(`.val-group[data-cat="${c.key}"]`, groups); if (!g) return;
      const ids = accounts.filter(a => a.cat === c.key).map(a => a.id);

  });
  $("#v-add").onclick = () => accountDialog(null, () => go());
  $("#v-del")?.addEventListener("click", () => confirmDialog(`Bewertung vom ${fmtDate(editing.date)} löschen?`, "Das lässt sich nicht rückgängig machen.", "Löschen", () => {
    DB.snapshots = DB.snapshots.filter(s => s !== editing); save(true); toast("Bewertung gelöscht"); location.hash = "#verlauf";
  }));
  $("#v-save").onclick = () => {
    const msg = $("#v-msg");

    const clash = DB.snapshots.find(s => s.date === draft.date && s !== editing);

    const prevAth = ath().v;
    const values = {}; Object.entries(draft.values).forEach(([id, val]) => { if (accById(id)) values[id] = round2(+val || 0); });
    const detail = {}; Object.entries(draft.detail).forEach(([id, d]) => { if (values[id] != null) detail[id] = d; });
    if (editing) Object.assign(editing, {date: draft.date, note: draft.note, values, detail});
    else DB.snapshots.push({id: "s" + uid(), date: draft.date, note: draft.note, values, detail});
    save(true);
    const t = total({values}), crossed = (DB.plan.milestones || []).filter(m => t >= m && prevAth < m).sort((a, b) => b - a)[0];
    if (!editing && crossed) celebrate(`Meilenstein ${eur0(crossed)} erreicht!`, `Nettovermögen ${eur0(t)}`, true);
    else if (!editing && t > prevAth && DB.snapshots.length > 1) celebrate("Neues Allzeithoch!", `Nettovermögen ${eur0(t)}`, true);
    else celebrate(editing ? "Änderungen gespeichert" : "Bewertung gespeichert", `Nettovermögen ${eur0(t)}`);
    editId = null; location.hash = "#uebersicht";
  };
};

/* ================= Views: Aktien & ETFs, Krypto ================= */
/* Slice colours for accounts inside one category, in the validated neighbour order. */
const SLICE = ["var(--cat-wertpapiere)", "var(--cat-liquiditaet)", "var(--cat-edelmetalle)", "var(--cat-guthaben)", "var(--cat-krypto)", "var(--cat-sachwerte)", "var(--cat-bargeld)"];
function donutSVG(slices, totalV, centerLabel) {
  const R = 70, SW = 20, C = 2 * Math.PI * R, GAP = slices.length > 1 ? 3 : 0;
  let off = 0;

function xirr(flows) {
  if (flows.length < 2) return NaN;
  const t0 = parseD(flows[0].date);
  const f = r => flows.reduce((s, c) => s + c.amount / Math.pow(1 + r, (parseD(c.date) - t0) / (365 * 864e5)), 0);
  let lo = -0.99, hi = 10, flo = f(lo), fhi = f(hi);
  if (flo * fhi > 0) return NaN;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (Math.abs(fm) < 1e-7) return mid; (flo * fm < 0) ? (hi = mid, fhi = fm) : (lo = mid, flo = fm); }
  return (lo + hi) / 2;
}

      kpi("Wertzuwachs ohne Einzahlungen", sEur0(gain), `<span class="muted">bis ${fmtDate(L.date)}</span>`) + kpi("Echte Rendite p. a.", isFinite(r) ? pct(r) : "–", `<span class="muted">Wachstum inkl. Einzahlungen ${G ? pct(G.cagr) : "–"}</span>`);
    $("#cf").innerHTML = cfs.length ? `<thead><tr><th>Datum</th><th class="n">Betrag</th><th>Notiz</th><th></th></tr></thead><tbody>${cfs.map(c => `<tr><td class="num">${fmtDate(c.date)}</td><td class="n ${cls(c.amount)}">${sEur(c.amount)}</td><td>${esc(c.note || "")}</td><td class="n"><button class="btn ghost sm" type="button" data-cfrm="${c.id}" aria-label="Löschen">${I.trash}</button></td></tr>`).join("")}</tbody>` : `<tbody><tr><td class="muted">Noch keine Ein- oder Auszahlungen erfasst. Ohne Einzahlungen entspricht die echte Rendite dem Gesamtwachstum.</td></tr></tbody>`;
    $$("[data-cfrm]").forEach(b => b.onclick = () => { P.cashflows = P.cashflows.filter(c => c.id !== b.dataset.cfrm); save(); drawCF(); });
  };
  $("#cf-add").onclick = () => {
    const d = $("#cf-d").value, a = parseNum($("#cf-a").value);
    if (!d || !okNum(a) || !a) { $("#cf-a").setAttribute("aria-invalid", "true"); return; }
    P.cashflows.push({id: "c" + uid(), date: d, amount: a, note: $("#cf-n").value.trim()}); save(); $("#cf-a").value = ""; $("#cf-n").value = ""; drawCF();
  };
  drawCF();
};

/** Reads a QR code with the device camera. onCode(text) returns true to stop. Returns a stop function. */
async function scanQR(video, box, onCode) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("Dieses Gerät erlaubt hier keinen Kamerazugriff. Bitte den Code kopieren und einfügen.");
  if (!window.jsQR) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; sc.onload = res; sc.onerror = () => rej(new Error("Der Scanner konnte nicht geladen werden. Besteht eine Internetverbindung?")); document.head.append(sc); });
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false}); }
  catch (e) { throw new Error(e?.name === "NotAllowedError" ? "Kamerazugriff wurde abgelehnt. Erlaube ihn in den iPhone-Einstellungen oder füge den Code per Kopieren ein." : "Die Kamera konnte nicht gestartet werden."); }
  video.srcObject = stream; box.hidden = false; await video.play().catch(() => {});
  const cv = document.createElement("canvas"), g = cv.getContext("2d", {willReadFrequently: true});
  let live = true;
  const stop = () => { if (!live) return; live = false; stream.getTracks().forEach(t => t.stop()); video.srcObject = null; box.hidden = true; };
  const tick = () => {
    if (!live) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const w = Math.min(960, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
      cv.width = w; cv.height = h; g.drawImage(video, 0, 0, w, h);
      const res = window.jsQR(g.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: "dontInvert"});
      if (res?.data && onCode(res.data)) { stop(); navigator.vibrate?.(30); return; }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return stop;
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement("a"), {href: url, download: name}); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
