    if (vmode === "cat") return DB.categories.map(c => ({key: "c:" + c.key, head: `${catChip(c.key)}${esc(c.label)}`, list: accounts.filter(a => a.cat === c.key)})).filter(g => g.list.length);
    const m = new Map();
    accounts.forEach(a => { const pl = platOf(a); if (!m.has(pl.key)) m.set(pl.key, {key: "p:" + pl.key, plat: pl, list: []}); m.get(pl.key).list.push(a); });
    const val = a => draft.values[a.id] ?? base?.values[a.id] ?? 0;
    return [...m.values()].map(g => {
      const p = platByKey(g.plat.key) || {name: g.plat.name, accs: g.list};
      g.list.sort((x, y) => catIdx(x.cat) - catIdx(y.cat));
      g.head = `${platLogo(p)}<span style="font-weight:700">${esc(g.plat.name)}</span>`;
      g.sum = g.list.reduce((t, a) => t + val(a), 0);
      return g;
    }).sort((x, y) => y.sum - x.sum || x.plat.name.localeCompare(y.plat.name));
  };
  let gs = [];
  const groupCard = g => {
      const o = !closed.has(g.key), have = new Set(g.list.map(a => a.cat));
      const missing = g.plat ? DB.categories.filter(c => !have.has(c.key)) : [];
      return `<div class="card val-group" data-g="${esc(g.key)}">
        <div class="gh" role="button" tabindex="0" aria-expanded="${o}"><span class="l">${I.chev}${g.head} <span class="muted" style="font-weight:400">${g.list.length}</span></span>
          <span class="r"><span class="num" data-cat-delta style="font-size:13px"></span><b class="num" data-cat-sum></b></span></div>
        <div class="fold ${o ? "open" : ""}"><div class="gb">
          <div class="vrow vrow-h"><span>${g.plat ? "Bereich" : "Konto"}</span><span style="text-align:right">${base ? fmtDate(base.date) : "Vorher"}</span><span style="text-align:right">Neuer Wert</span><span style="text-align:right">Veränderung</span></div>
          ${g.list.map(a => vrow(a, !!g.plat)).join("")}
          ${g.plat && missing.length ? `<div class="v-addcat"><button class="btn ghost sm" type="button" data-addcat="${esc(g.plat.key)}" aria-expanded="false">${I.plus} Kategorie hinzufügen</button>
            <div class="fold"><div><div class="v-catpick">${missing.map(c => `<button class="plat-cat" type="button" data-newcat="${c.key}" data-plat="${esc(g.plat.key)}">${catChip(c.key, "sm")}<span>${esc(c.label)}</span></button>`).join("")}</div></div></div></div>` : ""}
        </div></div></div>`;
  };
  const changeOf = id => (draft.values[id] || 0) - (base?.values[id] || 0);
  /** Guided month-end: one platform per step (only those that need typing), then a summary. */
  const renderGuided = () => {
    const all = groupList();
    if (!gKeys) gKeys = all.filter(g => g.list.some(a => !isLive(a))).map(g => g.key);
    const steps = gKeys.map(k => all.find(g => g.key === k)).filter(Boolean), auto = all.filter(g => !gKeys.includes(g.key));
    gIdx = Math.max(0, Math.min(gIdx, steps.length));
    const done = gIdx >= steps.length, pctDone = steps.length ? gIdx / steps.length : 1;
    const bar = `<div class="g-prog"><div class="g-bar"><span style="width:${pctDone * 100}%"></span></div><span class="muted" style="font-size:13px">${done ? "Alles durchgegangen" : `Schritt ${gIdx + 1} von ${steps.length}`}${auto.length ? ` · ${auto.length} Plattform${auto.length === 1 ? "" : "en"} automatisch ✓` : ""}</span></div>`;
    if (!done) {
      const g = steps[gIdx]; gs = [g];
      closed.delete(g.key);
      groups.innerHTML = bar + groupCard(g).replace('class="card val-group"', 'class="card val-group g-step"') +
        `<div class="g-nav"><button class="btn" type="button" id="g-back" ${gIdx === 0 ? "disabled" : ""}>← Zurück</button><button class="btn primary" type="button" id="g-next">${gIdx === steps.length - 1 ? "Zur Zusammenfassung" : "Weiter"} →</button></div>`;
    } else {
      gs = [];
      const t = total(draft), bt = total(base);
      const ch = accounts.map(a => ({a, d: changeOf(a.id)})).filter(x => Math.abs(x.d) >= 1).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 5);
      groups.innerHTML = bar + `<div class="card g-sum"><div class="card-b" style="display:grid;gap:16px">
          <div><div class="eyebrow">Neues Nettovermögen</div><div class="big num">${eur(t)}</div>${base ? `<span class="chip ${cls(t - bt)}">${sEur(t - bt)} · ${pct(t / bt - 1)}</span> <span class="muted">seit ${fmtDate(base.date)}</span>` : ""}</div>
          ${ch.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Größte Veränderungen</div>${ch.map(x => `<div class="plat-row" style="cursor:default"><span class="nm with-logo">${accLogo(x.a)}<span><b>${esc(x.a.provider || x.a.name)}</b><small>${esc(catLabel(x.a.cat))}</small></span></span><span class="num ${cls(x.d)}">${sEur(x.d)}</span></div>`).join("")}</div>` : ""}
          ${auto.length ? `<div><div class="eyebrow" style="margin-bottom:8px">Automatisch bewertet</div><div class="g-done">${auto.map(g => `<span>${platLogo(platByKey(g.plat.key) || {name: g.plat.name, accs: g.list}, "sm")}${esc(g.plat.name)} · <b class="num">${eur0(g.list.reduce((x, a) => x + (draft.values[a.id] || 0), 0))}</b></span>`).join("")}</div></div>` : ""}
        </div></div>
        <div class="g-nav"><button class="btn" type="button" id="g-back" ${steps.length ? "" : "disabled"}>← Zurück</button><button class="btn primary" type="button" id="g-save">${I.check || ""} Bewertung speichern</button></div>`;
    }
    $("#g-back")?.addEventListener("click", () => { gIdx--; renderGroups(); window.scrollTo({top: 0, behavior: reduced() ? "auto" : "smooth"}); });
    $("#g-next")?.addEventListener("click", () => { gIdx++; renderGroups(); window.scrollTo({top: 0, behavior: reduced() ? "auto" : "smooth"}); setTimeout(() => $("input[data-acc]", groups)?.focus({preventScroll: true}), 60); });
    $("#g-save")?.addEventListener("click", () => $("#v-save").click());
  };
  const renderGroups = () => {
    $$("#v-mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === vmode));
    $("#v-all").hidden = vmode === "guided"; document.body.classList.toggle("v-guided", vmode === "guided");
    if (vmode === "guided") { renderGuided(); bindRows(); return; }
    gs = groupList();
    groups.innerHTML = gs.map(groupCard).join("") || '<div class="card empty">Noch nichts erfasst. Lege mit „Plattform hinzufügen“ die erste an.</div>';
    const allOpen = gs.every(g => !closed.has(g.key));
    $("#v-all").textContent = allOpen ? "Alle zuklappen" : "Alle aufklappen";
    $$(".gh", groups).forEach(h => {
      const t = () => { const k = h.parentElement.dataset.g, o = closed.has(k); o ? closed.delete(k) : closed.add(k); store.set("val-closed", [...closed]); h.setAttribute("aria-expanded", o); h.nextElementSibling.classList.toggle("open", o); $("#v-all").textContent = gs.every(g => !closed.has(g.key)) ? "Alle zuklappen" : "Alle aufklappen"; };
      h.onclick = t; h.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } };
    });
    bindRows();
  };
  const bindRows = () => {
    $$("[data-vm]", groups).forEach(b => b.onclick = () => {
      const a = accById(b.dataset.vm), live = b.dataset.m === "live";
      if (!live && !isLive(a) && !LIVE_PENDING.has(a.id)) return;
      const refresh = () => { if (isLive(a)) { liveFill(a); updateTotals(); } renderGroups(); };
      if (!live) { LIVE_PENDING.delete(a.id); ihOpen.delete(a.id); a.manual = true; save(true); renderGroups(); $(`input[data-acc="${a.id}"]`, groups)?.focus(); return; }
      if (live === (isLive(a) || LIVE_PENDING.has(a.id))) return;
      delete a.manual; save(true); ihOpen.add(a.id);
      if (a.holdings.length) { refresh(); refreshQuotes(true).then(refresh); }
      else if (!AUTO_TYPE[a.cat]) { a.manual = true; renderGroups(); cashDialog(a, null, () => { delete a.manual; refresh(); refreshQuotes(true).then(refresh); }, {}); }
      else { LIVE_PENDING.add(a.id); renderGroups(); setTimeout(() => $(`[data-ih="${a.id}"] [data-ihs]`, groups)?.focus(), 40); }
    });
    $$("[data-iht]", groups).forEach(b => b.onclick = () => { const id = b.dataset.iht; ihOpen.has(id) ? ihOpen.delete(id) : ihOpen.add(id); renderGroups(); });
    accounts.forEach(a => bindPosEditor(groups, a, {prevAmt: base?.values[a.id] ?? 0,
      onValue: () => { if (isLive(a) && liveFill(a)) { const i = $(`input[data-acc="${a.id}"]`, groups); if (i) { i.value = fmtN.format(draft.values[a.id]); hint(a.id, i.value); } updateTotals(a.id); } },
      redraw: () => { if (isLive(a)) liveFill(a); renderGroups(); }}));
    $$("[data-vrm]", groups).forEach(b => b.onclick = () => {
      const a = accById(b.dataset.vrm);
      const kept = draft.values[a.id];
      removeArea(a, () => { const i = accounts.indexOf(a); if (i >= 0) accounts.splice(i, 1); delete draft.values[a.id]; delete draft.detail[a.id]; renderGroups(); },
        () => { if (!accounts.includes(a)) accounts.push(a); draft.values[a.id] = kept ?? 0; renderGroups(); });
    });
    $$("[data-addcat]", groups).forEach(b => b.onclick = () => { const f = b.nextElementSibling, o = !f.classList.contains("open"); f.classList.toggle("open", o); b.setAttribute("aria-expanded", o); });
    $$("[data-newcat]", groups).forEach(b => b.onclick = () => {
      const g = gs.find(x => x.plat?.key === b.dataset.plat), cat = b.dataset.newcat, src = g.list.find(a => a.domain) || g.list[0];
      const na = {id: slugId(cat, g.plat.name), name: g.plat.name, provider: src.provider || g.plat.name, ...(src.domain ? {domain: src.domain} : {}), cat, holdings: [], archived: false};
      DB.accounts.push(na); accounts.push(na); draft.values[na.id] = 0; save(true);
      toast(`${g.plat.name} · ${catLabel(cat)} angelegt`); renderGroups();
      const inp = $(`input[data-acc="${na.id}"]`, groups); inp?.focus(); inp?.scrollIntoView({block: "center", behavior: reduced() ? "auto" : "smooth"});
    });
    $$("input[data-acc]", groups).forEach((inp, i, all) => {
      inp.addEventListener("input", () => {
        const n = parseNum(inp.value); inp.setAttribute("aria-invalid", Number.isNaN(n));
        draft.values[inp.dataset.acc] = okNum(n) ? round2(n) : 0; delete draft.detail[inp.dataset.acc];
        updateTotals(inp.dataset.acc); hint(inp.dataset.acc, inp.value);
      });
      hint(inp.dataset.acc, inp.value);
      inp.addEventListener("blur", () => { const n = parseNum(inp.value); if (okNum(n)) inp.value = fmtN.format(round2(n)); });
      inp.addEventListener("focus", () => inp.select());
      // Enter jumps to the next visible field – quick walk through all accounts
      inp.addEventListener("keydown", e => { if (e.key !== "Enter") return; e.preventDefault(); const next = all.slice(i + 1).find(x => x.offsetParent && getComputedStyle(x).visibility !== "hidden"); if (!next && vmode === "guided") { inp.blur(); $("#g-next")?.click(); return; } if (next) { next.focus(); next.scrollIntoView({block: "center", behavior: reduced() ? "auto" : "smooth"}); } else inp.blur(); });
    });
    updateTotals();
  };
  $$("#v-mode button").forEach(b => b.onclick = () => { vmode = b.dataset.v; store.set("val-mode", vmode); renderGroups(); });
  $("#v-all").onclick = () => { const o = gs.every(g => !closed.has(g.key)); gs.forEach(g => o ? closed.add(g.key) : closed.delete(g.key)); store.set("val-closed", [...closed]); renderGroups(); };
  /** Under each field: result of a calculation ("629*4,69 = 2.950,01") and, on the phone, the change since the last valuation. */
  const hint = (id, raw) => {
    const el = $(`[data-hint="${id}"]`, groups); if (!el) return;
    const v = draft.values[id] || 0, d = changeOf(id), isCalc = /\d\s*[-+*/×x:]\s*\d/.test(String(raw || "").replace(/^-/, ""));
    el.innerHTML = (isCalc ? `<span class="h-calc">= ${fmtN.format(v)}</span>` : "") + (Math.abs(d) >= .005 && base ? `<span class="h-delta ${cls(d)}">${isCalc ? " · " : ""}${sEur(d)}</span>` : "") +
      (base && base.values[id] == null && v > 0 && !draft.moved?.[id] ? `<button class="v-trq" type="button" data-vtr="${id}">Von anderem Konto überwiesen?</button>` : "");
  };
  const updateTotals = only => {
    const t = total(draft), bt = total(base);
    $("#v-tot").textContent = eur(t);
    $("#v-delta").innerHTML = base ? `<span class="chip ${cls(t - bt)}">${sEur(t - bt)} · ${pct(t / bt - 1)}</span> <span class="muted">ggü. ${fmtDate(base.date)}</span>` : "";
    (only ? [only] : accounts.map(a => a.id)).forEach(id => { const el = $(`[data-delta="${id}"]`, groups); if (!el) return; const d = (draft.values[id] || 0) - (base?.values[id] || 0); el.className = "delta num " + cls(d); el.textContent = Math.abs(d) < .005 ? "–" : sEur(d); });
    gs.forEach(g => {
      const el = [...groups.children].find(x => x.dataset.g === g.key); if (!el) return;
      const ids = g.list.map(a => a.id);
      const sm = ids.reduce((x, id) => x + (draft.values[id] || 0), 0), pv = ids.reduce((x, id) => x + (base?.values[id] || 0), 0);
      $("[data-cat-sum]", el).textContent = eur(sm);
      const de = $("[data-cat-delta]", el); de.className = "num " + cls(sm - pv); de.textContent = base && Math.abs(sm - pv) >= .005 ? sEur(sm - pv) : "";
    });
  };
  renderGroups();
  $("#v-date").onchange = e => draft.date = e.target.value;
  groups.addEventListener("click", e => {
    const b = e.target.closest("[data-vtr]"); if (!b) return;
    const id = b.dataset.vtr;
    transferDialog({to: id, amount: draft.values[id], date: draft.date, onSaved: t => {
      (draft.moved ||= {})[id] = true;
      if (!isLive(accById(t.from))) draft.values[t.from] = round2((draft.values[t.from] || 0) - t.amount);
      renderGroups(); toast(`${accById(t.from).provider || accById(t.from).name}: −${eur(t.amount)} – zählt nicht als Zuwachs`);
    }}, () => {});
  });
  $("#v-tr")?.addEventListener("click", () => transferDialog({}, () => go(true)));
  $("#v-note").oninput = e => draft.note = e.target.value;
  $("#v-q")?.addEventListener("click", async () => {
    await refreshQuotes(true);
    let n = 0; accounts.filter(isLive).forEach(a => { if (liveFill(a)) n++; });
    renderGroups(); toast(n ? `${n} Konto/Konten mit aktuellen Kursen bewertet` : "Keine aktuellen Kurse verfügbar");
  });
  $("#v-add").onclick = () => accountDialog(null, na => { if (na && !accounts.includes(na)) { accounts.push(na); draft.values[na.id] = 0; } renderGroups(); const inp = na && $(`input[data-acc="${na.id}"]`, groups); inp?.focus(); });
  $("#v-del")?.addEventListener("click", () => confirmDialog(`Bewertung vom ${fmtDate(editing.date)} löschen?`, "Das lässt sich nicht rückgängig machen.", "Löschen", () => {
    DB.snapshots = DB.snapshots.filter(s => s !== editing); save(true); toast("Bewertung gelöscht"); location.hash = "#verlauf";
  }));
  $("#v-save").onclick = () => {
    const msg = $("#v-msg");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(draft.date)) { msg.innerHTML = '<div class="msg">Bitte ein gültiges Datum wählen.</div>'; return; }
    const clash = DB.snapshots.find(s => s.date === draft.date && s !== editing);
    if (clash) { msg.innerHTML = `<div class="msg">Für den ${fmtDate(draft.date)} gibt es schon eine Bewertung. Wähle ein anderes Datum oder <a href="#verlauf">bearbeite sie im Verlauf</a>.</div>`; return; }
    const prevAth = ath().v;
    const values = {}; Object.entries(draft.values).forEach(([id, val]) => { if (accById(id)) values[id] = round2(+val || 0); });
    const detail = {}; Object.entries(draft.detail).forEach(([id, d]) => { if (values[id] != null) detail[id] = d; });
    // a value typed by hand for an account that consists of a single amount keeps that amount in sync
    if (!editing) accounts.forEach(a => { const h = a.holdings?.[0]; if (a.holdings?.length === 1 && h.type === "cash" && !draft.detail[a.id] && values[a.id] != null) h.qty = round2(Math.abs(values[a.id])); });
    if (editing) Object.assign(editing, {date: draft.date, note: draft.note, values, detail});
    else DB.snapshots.push({id: "s" + uid(), date: draft.date, note: draft.note, values, detail});
    save(true);
    const t = total({values}), crossed = (DB.plan.milestones || []).filter(m => t >= m && prevAth < m).sort((a, b) => b - a)[0];
    if (!editing && crossed) celebrate(`Meilenstein ${eur0(crossed)} erreicht!`, `Nettovermögen ${eur0(t)}`, true);
    else if (!editing && t > prevAth && DB.snapshots.length > 1) celebrate("Neues Allzeithoch!", `Nettovermögen ${eur0(t)}`, true);
    else celebrate(editing ? "Änderungen gespeichert" : "Bewertung gespeichert", `Nettovermögen ${eur0(t)}`);
    editId = null; location.hash = "#uebersicht";
  };
};

    off += len; return seg; }).join("")}</svg><div class="center"><b class="num" data-cv>${eur0(totalV)}</b><span data-cl>${esc(centerLabel)}</span></div>`;

/** Lieferando logo for navigation and buttons (16px, falls back to the cutlery icon). */
const lfIcon = () => `<span class="lf-ic" aria-hidden="true">${I.utensils}<img src="${favicon("lieferando.at")}" alt="" referrerpolicy="no-referrer" onload="this.classList.add('ok')" onerror="this.remove()"></span>`;
const monthOf = d => (d || "").slice(0, 7);
const monthLabel = m => parseD(m + "-01").toLocaleDateString(LOCALE, {month: "long", year: "numeric"});
const shiftMonth = (m, k) => addMonths(m + "-01", k).slice(0, 7);
/** Order maths. New orders: own food + each colleague's food + delivery fee, fee split evenly across everyone (you included).
    Older orders (total + own, optional amounts per person) keep their original calculation. */
const isNewOrder = o => o.fee != null || o.serviceRate != null || (o.participants || []).some(x => x.food != null);

/** Combobox: opens the list on focus, filters while typing, offers "add new" for unknown names.
    items(): [{name, sub, logo}] */
function comboBox(inp, list, items, onPick, noun = "Eintrag", openOnFocus = true) {
  let opts = [], sel = -1;
  const close = () => { list.hidden = true; inp.setAttribute("aria-expanded", "false"); sel = -1; };
  const draw = () => {
    const all = items(), q = inp.value.trim(), ql = q.toLowerCase();
    const hits = all.filter(r => !ql || r.name.toLowerCase().includes(ql));
    const exact = all.some(r => r.name.toLowerCase() === ql);
    opts = [...hits, ...(q && !exact ? [{name: q, add: true}] : [])];
    if (!opts.length) list.innerHTML = `<div class="hint" style="padding:10px">Noch nichts gespeichert. Einfach den Namen eintippen.</div>`;
    else list.innerHTML = opts.map((x, i) => x.add
      ? `<button type="button" tabindex="-1" role="option" data-i="${i}" aria-selected="${i === sel}"><span class="type-ic" style="--tc:var(--brand)">${I.plus}</span><span class="add">„${esc(x.name)}“ als ${noun} hinzufügen</span><span></span></button>`
      : `<button type="button" tabindex="-1" role="option" data-i="${i}" aria-selected="${i === sel}">${x.logo ?? logoBox("", x.name, "sm")}<span>${esc(x.name)}</span><small class="num">${esc(x.sub || "")}</small></button>`).join("");
    list.hidden = false; inp.setAttribute("aria-expanded", "true");
    $$("button", list).forEach(b => b.onmousedown = e => { e.preventDefault(); pick(+b.dataset.i); });
  };
  const pick = i => { const x = opts[i]; if (!x) return; inp.value = x.name; close(); inp.dispatchEvent(new Event("input")); onPick?.(x.name); };
  if (openOnFocus) inp.addEventListener("focus", draw);
  inp.addEventListener("click", draw);
  inp.addEventListener("input", e => { if (e.isTrusted) { sel = -1; draw(); } });
  inp.addEventListener("blur", () => setTimeout(close, 120));
  inp.addEventListener("keydown", e => {
    if (list.hidden && (e.key === "ArrowDown" || e.key === "ArrowUp")) draw();
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(opts.length - 1, sel + 1); draw(); $(`[data-i="${sel}"]`, list)?.scrollIntoView({block: "nearest"}); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); $(`[data-i="${sel}"]`, list)?.scrollIntoView({block: "nearest"}); }
    else if (e.key === "Enter") { e.preventDefault(); if (!list.hidden && sel >= 0) pick(sel); else if (!list.hidden && opts.length === 1) pick(0); else { close(); onPick?.(inp.value.trim()); } }
    else if (e.key === "Escape" && !list.hidden) { e.preventDefault(); e.stopPropagation(); close(); }
  });
}

function setAuto(a, on, done) {
  if (on) {
    delete a.manual;

}

/* ================= View: Ziele & Planung ================= */
function xirr(flows) {
  if (flows.length < 2) return NaN;
  const t0 = parseD(flows[0].date);
  const f = r => flows.reduce((s, c) => s + c.amount / Math.pow(1 + r, (parseD(c.date) - t0) / (365 * 864e5)), 0);
  let lo = -0.99, hi = 10, flo = f(lo), fhi = f(hi);
  if (flo * fhi > 0) return NaN;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (Math.abs(fm) < 1e-7) return mid; (flo * fm < 0) ? (hi = mid, fhi = fm) : (lo = mid, flo = fm); }
  return (lo + hi) / 2;
}

    $$("[data-t]").forEach(inp => inp.onchange = () => { const n = parseNum(inp.value); if (okNum(n)) { P.targets[inp.dataset.t] = n / 100; save(); drawTargets(); } else inp.setAttribute("aria-invalid", "true"); });
  };
  drawTargets();

  // milestones
  const drawMiles = () => {
    const ms = [...P.milestones].sort((a, b) => a - b);
    $("#miles").innerHTML = `<div style="display:grid;gap:14px">${ms.map(m => {
      const prog = Math.min(1, tot / m), missing = Math.max(0, m - tot), months = G && G.perMonth > 0 ? missing / G.perMonth : Infinity;
      const eta = missing <= 0 ? "erreicht" : isFinite(months) ? "ca. " + parseD(addMonths(L.date, Math.ceil(months))).toLocaleDateString(LOCALE, {month: "long", year: "numeric"}) : "–";
      return `<div style="display:grid;gap:6px"><div class="split"><b class="num">${eur0(m)}</b><span class="${missing <= 0 ? "pos" : "muted"}">${eta}</span><button class="btn ghost sm" type="button" data-rm="${m}" aria-label="Meilenstein ${eur0(m)} entfernen">${I.x}</button></div>
        <div class="progress"><span style="width:${prog * 100}%"></span></div>
        <div class="split hint"><span>${fmtPs.format(prog)}</span><span>${missing > 0 ? "noch " + eur0(missing) : ""}</span></div></div>`;
    }).join("")}
    <div style="display:flex;gap:8px"><input class="input n" id="ms-new" inputmode="decimal" placeholder="Neues Ziel, z. B. 2.000.000" aria-label="Neuer Meilenstein"><button class="btn" type="button" id="ms-add">${I.plus}</button></div></div>`;
    $$("[data-rm]", $("#miles")).forEach(b => b.onclick = () => { P.milestones = P.milestones.filter(x => x !== +b.dataset.rm); save(); drawMiles(); });
    $("#ms-add").onclick = () => { const n = parseNum($("#ms-new").value); if (okNum(n) && n > 0) { P.milestones.push(n); save(); drawMiles(); } };
  };
  drawMiles();

  // budget & forecast
  const fcCats = DB.categories.filter(c => P.forecast[c.key] || ct[c.key]);
  const drawBudget = () => {
    const inc = +P.budget.income || 0, exp = +P.budget.expenses || 0, rate = inc - exp;
    const planned = Object.values(P.forecast).reduce((s, f) => s + (+f.monthly || 0), 0), gap = rate - planned;
    $("#budget").innerHTML = `<div class="r" style="align-items:center"><label for="b-inc">Einkommen</label><input class="input sm n" id="b-inc" style="width:120px;text-align:right" value="${fmtN.format(inc)}"></div>
      <div class="r" style="align-items:center"><label for="b-exp">Ausgaben</label><input class="input sm n" id="b-exp" style="width:120px;text-align:right" value="${fmtN.format(exp)}"></div>
      <div class="r total"><span>Sparrate</span><span class="num">${eur(rate)}</span></div>
      <div class="r"><span>davon in der Prognose verplant</span><span class="num">${eur(planned)}</span></div>
      <div class="r"><span>${gap >= 0 ? "noch frei" : "nicht gedeckt"}</span><b class="num ${gap >= 0 ? "pos" : "neg"}">${eur(gap)}</b></div>
      ${gap < 0 ? `<p class="msg" style="margin:0">Du verplanst monatlich ${eur0(-gap)} mehr, als du sparst. Passe die monatlichen Beträge in der Prognose oder dein Budget an.</p>` : ""}`;
    $("#b-inc").onchange = e => { const n = parseNum(e.target.value); if (okNum(n)) { P.budget.income = n; save(); drawBudget(); } };
    $("#b-exp").onchange = e => { const n = parseNum(e.target.value); if (okNum(n)) { P.budget.expenses = n; save(); drawBudget(); } };
  };
  const project = () => {
    const years = Math.max(1, Math.min(40, Math.round(P.years || 15)));
    const rows = fcCats.map(c => { const f = P.forecast[c.key] || {rate: 0, monthly: 0}; let val = ct[c.key] || 0; const out = [val]; for (let y = 1; y <= years; y++) { val = (val + (+f.monthly || 0) * 12) * (1 + (+f.rate || 0)); out.push(val); } return {c, f, out}; });
    const rest = tot - fcCats.reduce((s, c) => s + (ct[c.key] || 0), 0);
    const totals = Array.from({length: years + 1}, (_, y) => rows.reduce((s, r) => s + r.out[y], 0) + rest);
    return {years, rows, totals};
  };
  const drawForecast = () => {
    const {years, rows, totals} = project();
    const dates = Array.from({length: years + 1}, (_, y) => addMonths(L.date, 12 * y));
    const series = [{label: "Gesamt (Prognose)", color: "var(--chart)", values: totals}, ...rows.filter(r => (+r.f.rate || +r.f.monthly) && r.out.some(x => Math.abs(x) > 1)).map(r => ({label: r.c.label, color: catColor(r.c.key), values: r.out, dash: true}))];
    lineChart($("#ch-fc"), {dates, series, tipTitle: (d, i) => i === 0 ? "Heute" : `In ${i} Jahr${i > 1 ? "en" : ""} (${parseD(d).getFullYear()})`});
    $("#fc-legend").innerHTML = series.map(s => `<span style="display:inline-flex;gap:6px;align-items:center"><i class="sw" style="background:${s.color}"></i>${esc(s.label)}</span>`).join("");
    const cols = [1, 5, 10, years].filter((y, i, a) => y <= years && a.indexOf(y) === i);
    $("#fc").innerHTML = `<thead><tr><th>Kategorie</th><th class="n">Heute</th><th class="n">Rendite p. a.</th><th class="n">Monatlich</th>${cols.map(y => `<th class="n">in ${y} J.</th>`).join("")}</tr></thead><tbody>` +
      rows.map(r => `<tr><td><span class="inl">${catChip(r.c.key, "sm")}${esc(r.c.label)}</span></td><td class="n">${eur0(r.out[0])}</td>
        <td class="n"><input class="input sm n cell-in" style="width:70px" data-fr="${r.c.key}" value="${((r.f.rate || 0) * 100).toLocaleString("de-DE", {maximumFractionDigits: 2})}" aria-label="Rendite ${esc(r.c.label)}"> %</td>
        <td class="n"><input class="input sm n cell-in" data-fm="${r.c.key}" value="${fmtN.format(r.f.monthly || 0)}" aria-label="Monatlich ${esc(r.c.label)}"></td>
        ${cols.map(y => `<td class="n">${eur0(r.out[y])}</td>`).join("")}</tr>`).join("") +
      `<tr class="total"><td>Gesamt</td><td class="n">${eur0(totals[0])}</td><td></td><td class="n">${eur0(Object.values(P.forecast).reduce((s, f) => s + (+f.monthly || 0), 0))}</td>${cols.map(y => `<td class="n">${eur0(totals[y])}</td>`).join("")}</tr></tbody>`;
    const upd = (k, field, val) => { P.forecast[k] ||= {rate: 0, monthly: 0}; P.forecast[k][field] = val; save(); drawForecast(); drawBudget(); };
    $$("[data-fr]").forEach(i => i.onchange = () => { const n = parseNum(i.value); okNum(n) ? upd(i.dataset.fr, "rate", n / 100) : i.setAttribute("aria-invalid", "true"); });
    $$("[data-fm]").forEach(i => i.onchange = () => { const n = parseNum(i.value); okNum(n) ? upd(i.dataset.fm, "monthly", n) : i.setAttribute("aria-invalid", "true"); });
  };
  $("#f-years").onchange = e => { const n = parseNum(e.target.value); if (okNum(n) && n >= 1) { P.years = Math.min(40, Math.round(n)); save(); drawForecast(); } };
  drawBudget(); drawForecast(); resizeFns.push(drawForecast);

  // cashflows & XIRR
  const drawCF = () => {
    const S = DB.snapshots, f = S[0];
    const cfs = [...P.cashflows].sort((a, b) => a.date.localeCompare(b.date));
    const inflow = cfs.filter(c => c.date > f.date && c.date <= L.date).reduce((s, c) => s + c.amount, 0);
    const flows = [{date: f.date, amount: -total(f)}, ...cfs.filter(c => c.date > f.date && c.date <= L.date).map(c => ({date: c.date, amount: -c.amount})), {date: L.date, amount: tot}];
    const r = xirr(flows), gain = tot - total(f) - inflow;
    $("#cf-kpis").innerHTML = kpi("Startwert", eur0(total(f)), `<span class="muted">${fmtDate(f.date)}</span>`) + kpi("Einzahlungen", sEur0(inflow), `<span class="muted">${cfs.length} Buchung${cfs.length === 1 ? "" : "en"}</span>`) +
      kpi("Wertzuwachs ohne Einzahlungen", sEur0(gain), `<span class="muted">bis ${fmtDate(L.date)}</span>`) + kpi("Echte Rendite p. a.", isFinite(r) ? pct(r) : "–", `<span class="muted">Wachstum inkl. Einzahlungen ${G ? pct(G.cagr) : "–"}</span>`);
    $("#cf").innerHTML = cfs.length ? `<thead><tr><th>Datum</th><th class="n">Betrag</th><th>Notiz</th><th></th></tr></thead><tbody>${cfs.map(c => `<tr><td class="num">${fmtDate(c.date)}</td><td class="n ${cls(c.amount)}">${sEur(c.amount)}</td><td>${esc(c.note || "")}</td><td class="n"><button class="btn ghost sm" type="button" data-cfrm="${c.id}" aria-label="Löschen">${I.trash}</button></td></tr>`).join("")}</tbody>` : `<tbody><tr><td class="muted">Noch keine Ein- oder Auszahlungen erfasst. Ohne Einzahlungen entspricht die echte Rendite dem Gesamtwachstum.</td></tr></tbody>`;
    $$("[data-cfrm]").forEach(b => b.onclick = () => { P.cashflows = P.cashflows.filter(c => c.id !== b.dataset.cfrm); save(); drawCF(); });
  };
  $("#cf-add").onclick = () => {
    const d = $("#cf-d").value, a = parseNum($("#cf-a").value);
    if (!d || !okNum(a) || !a) { $("#cf-a").setAttribute("aria-invalid", "true"); return; }
    P.cashflows.push({id: "c" + uid(), date: d, amount: a, note: $("#cf-n").value.trim()}); save(); $("#cf-a").value = ""; $("#cf-n").value = ""; drawCF();
  };
  drawCF();
};

$("#file-in").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj.accounts || !obj.snapshots) throw 0;
    const doIt = () => { DB = obj; migrate(); store.set("last-backup", new Date().toISOString()); save(true); toast("Daten importiert"); if (location.hash !== "#uebersicht") location.hash = "#uebersicht"; else go(); refreshQuotes(true); };
    if (!DB.snapshots.length) return doIt();
    openDlg(`<div class="dlg-h"><h2>Datei importieren</h2><button class="btn ghost sm icon" type="button" data-x aria-label="Schließen">${I.x}</button></div>
      <div class="dlg-b"><p class="sub" style="margin:0">Die Datei enthält ${obj.accounts.length} Konten und ${obj.snapshots.length} Bewertungen. Wie soll sie übernommen werden?</p>
        <div class="msg info"><b>Nur Logos und Zuordnungen</b> übernimmt Webseiten, Coin-Zuordnungen und Kategorien der Konten sowie Arbeitgeber und Einkommensquellen. Deine Bewertungen, Positionen, Einträge und Ziele bleiben unverändert.</div></div>
      <div class="dlg-f"><button class="btn danger" type="button" data-all>Alles ersetzen</button><div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn primary" type="button" data-meta>Nur Logos und Zuordnungen</button></div></div>`);
    $("[data-all]", dlg).onclick = () => { dlg.close(); doIt(); };
    $("[data-meta]", dlg).onclick = () => {
      let n = 0;
      obj.accounts.forEach(src => {
        const a = accById(src.id); if (!a) return;
        let ch = false;
        ["domain", "cat", "provider"].forEach(f => { if (src[f] != null && a[f] !== src[f]) { a[f] = src[f]; ch = true; } });
        if (JSON.stringify(a.coin || null) !== JSON.stringify(src.coin || null)) { if (src.coin) a.coin = src.coin; else delete a.coin; delete a.coinLogo; ch = true; }
        if (ch) n++;
      });
      const fs = obj.income?.settings;
      if (fs) {
        const ls = DB.income.settings;
        if (fs.employer && !ls.employer) ls.employer = fs.employer;
        Object.entries(fs.sources || {}).forEach(([ty, list]) => (list || []).forEach(nm => rememberSource(ty, nm)));
        Object.entries(fs.sourceDomains || {}).forEach(([k, d]) => { if (!ls.sourceDomains[k]) ls.sourceDomains[k] = d; });
      }
      save(true); dlg.close(); toast(`${n} Konto${n === 1 ? "" : "en"} aktualisiert`); go(); refreshQuotes(true);
    };
  } catch { toast("Die Datei ist kein gültiges Backup"); }
};
async function drawLockCard() {

          <p class="sub" id="l-info" style="margin:0"></p>` : `<p class="sub" style="margin:0">Leg eine PIN fest.</p>`}
          <div class="row2"><div class="field"><label for="lp1">PIN (mind. 4 Ziffern)</label><input class="input n" id="lp1" type="password" inputmode="numeric" autocomplete="new-password" required></div>

        el.innerHTML = useBio ? `Websites dürfen ${bioName} nur über einen <b>Passkey</b> nutzen. Nach „Einschalten“ fragt dein Gerät einmal, ob der Passkey <b>„Tracky App-Sperre“</b> gesichert werden soll – einfach bestätigen. Er dient nur zum Entsperren, enthält keine Daten und liegt in der Passwörter-App. Danach reicht beim Öffnen ein Blick; die PIN ist der Ersatz.`
          : "Kein Passkey: Tracky fragt beim Öffnen nur nach deiner PIN."; };
      $$("#l-mode button", dlg).forEach(b => b.onclick = () => { useBio = b.dataset.v === "bio"; info(); });

/** Reads a QR code with the device camera. onCode(text) returns true to stop. Returns a stop function. */
async function scanQR(video, box, onCode) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("Dieses Gerät erlaubt hier keinen Kamerazugriff. Bitte den Code kopieren und einfügen.");
  if (!window.jsQR) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"; sc.onload = res; sc.onerror = () => rej(new Error("Der Scanner konnte nicht geladen werden. Besteht eine Internetverbindung?")); document.head.append(sc); });
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: "environment"}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false}); }
  catch (e) { throw new Error(e?.name === "NotAllowedError" ? "Kamerazugriff wurde abgelehnt. Erlaube ihn in den iPhone-Einstellungen oder füge den Code per Kopieren ein." : "Die Kamera konnte nicht gestartet werden."); }
  video.srcObject = stream; box.hidden = false; await video.play().catch(() => {});
  const cv = document.createElement("canvas"), g = cv.getContext("2d", {willReadFrequently: true});
  let live = true;
  const stop = () => { if (!live) return; live = false; stream.getTracks().forEach(t => t.stop()); video.srcObject = null; box.hidden = true; };
  const tick = () => {
    if (!live) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const w = Math.min(960, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
      cv.width = w; cv.height = h; g.drawImage(video, 0, 0, w, h);
      const res = window.jsQR(g.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: "dontInvert"});
      if (res?.data && onCode(res.data)) { stop(); navigator.vibrate?.(30); return; }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return stop;
}

      if ($("#dp-repl", dlg).checked && !touched.has(a)) { const kinds = new Set(rows.filter(x => accFor(x) === a).map(x => x.kind || "stock")); a.holdings = a.holdings.filter(h => !kinds.has(h.type)); }
      touched.add(a);
      if (r.kind === "cash") {
        const ex = a.holdings.find(h => h.type === "cash" && h.name === r.name), item = {type: "cash", symbol: "", name: r.name, qty: round2(r.qty), ...(r.ccy !== "EUR" ? {ccy: r.ccy, rateEur: r.price} : {}), ...(a.cat === "kredite" ? {neg: true} : {})};
        if (ex) { delete ex.ccy; Object.assign(ex, item); } else a.holdings.push({id: "h" + uid(), ...item});
        n++; return;
      }
      if (r.kind === "crypto") {
        const ex = a.holdings.find(h => h.type === "crypto" && h.symbol === r.sym && h.name === r.name), item = {type: "crypto", symbol: r.sym, name: r.name, qty: r.qty, logo: r.logo || "", lastPrice: r.price, ...(isAddr(r.sym) ? {src: "dex"} : {})};
        if (ex) Object.assign(ex, item); else a.holdings.push({id: "h" + uid(), ...item});
        n++; return;
      }
      const ex = a.holdings.find(h => h.isin === r.isin || h.symbol === r.symbol);
      const cost = r.costPer ? {cost: {per: r.costPer}} : {};
      if (ex) Object.assign(ex, {qty: r.qty}, cost); else a.holdings.push({id: "h" + uid(), type: "stock", symbol: r.symbol, isin: r.isin, ...(r.ov ? {ov: r.ov} : {}), name: r.name || r.symbol, qty: r.qty, ...cost});
      n++;
    });
    save(true); dlg.close(); toast(`${n} Position${n === 1 ? "" : "en"} übernommen${touched.size > 1 ? ` in ${touched.size} Konten` : ""}`); done(); refreshQuotes(true);
  };
  if (!accs.length) $("#dp-prev", dlg).innerHTML = '<p class="msg" style="margin:0">Lege zuerst ein Konto in der Kategorie „Aktien & ETFs“ an.</p>';
}
function categoryDialog(done) {
  const cats = DB.categories.map(c => ({...c}));
  const draw = () => {
    openDlg(`<form id="cf"><div class="dlg-h"><h2>Kategorien</h2><button class="btn ghost sm" type="button" data-x aria-label="Schließen">${I.x}</button></div>
      <div class="dlg-b">${cats.map((c, i) => `<div style="display:flex;gap:8px;align-items:center">${catChip(c.key)}<input class="input" data-i="${i}" value="${esc(c.label)}" aria-label="Kategorie ${i + 1}">
        <button class="btn ghost sm" type="button" data-up="${i}" ${i ? "" : "disabled"} aria-label="Nach oben">↑</button>
        ${DB.accounts.some(a => a.cat === c.key) ? "" : `<button class="btn ghost sm danger" type="button" data-rm="${i}" aria-label="Entfernen">${I.x}</button>`}</div>`).join("")}
        <button class="btn sm" type="button" id="c-add" style="justify-self:start">${I.plus} Kategorie hinzufügen</button>
        <p class="hint" style="margin:0">Jede Kategorie hat eine feste Farbe und ein festes Symbol. Kategorien mit Konten können nicht entfernt werden.</p></div>
      <div class="dlg-f"><div class="r"><button class="btn" type="button" data-x>Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div></form>`);
    const sync = () => $$("input[data-i]", dlg).forEach(i => cats[+i.dataset.i].label = i.value);
    $$("[data-up]", dlg).forEach(b => b.onclick = () => { sync(); const i = +b.dataset.up; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; draw(); });
    $$("[data-rm]", dlg).forEach(b => b.onclick = () => { sync(); cats.splice(+b.dataset.rm, 1); draw(); });
    $("#c-add", dlg).onclick = () => { sync(); cats.push({key: "k" + uid(), label: "Neue Kategorie"}); draw(); };
    $("#cf", dlg).onsubmit = e => { e.preventDefault(); sync(); DB.categories = cats.filter(c => c.label.trim()).map(c => ({...c, label: c.label.trim()})); save(true); dlg.close(); toast("Kategorien gespeichert"); done(); };
  };
  draw();
}

/* ================= Theme & boot ================= */
const THEMES = [["light", "Hell", I.sun], ["dark", "Dunkel", I.moon], ["system", "System", I.monitor]];
let theme = store.get("theme", "system");
function applyTheme() {
  theme === "system" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", theme);
  $$(".theme-seg").forEach(el => {
    el.innerHTML = THEMES.map(([k, l, ic]) => `<button type="button" data-theme-set="${k}" aria-pressed="${theme === k}" title="${l}" aria-label="Darstellung ${l}">${ic}${el.dataset.labels ? l : ""}</button>`).join("");
    $$("button", el).forEach(b => b.onclick = () => { theme = b.dataset.themeSet; store.set("theme", theme); applyTheme(); resizeFns.forEach(f => f()); });
  });
}
applyTheme();
/* Updates: an installed iPhone app is usually resumed, not reloaded – so Tracky checks version.json on start
   and whenever it comes back to the foreground, and reloads itself when a newer version is online. */
const APP_VERSION = "tracky-v32";
let swReg = null;
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(r => swReg = r).catch(() => {}));
}
const Updater = {
  checkedAt: 0, latest: null,
  async check(force = false) {
    if (!force && Date.now() - this.checkedAt < 60000) return this.latest;
    this.checkedAt = Date.now();
    try { const j = await getJSON("version.json?t=" + Date.now(), {cache: "no-store"}, 6000); this.latest = j.v || null; } catch { return null; }
    swReg?.update().catch(() => {});
    if (this.latest && this.latest !== APP_VERSION) this.offer();
    return this.latest;
  },
  /** Reload right away when nothing is being edited, otherwise offer a button. */
  offer() {
    const busy = dlg.open || route === "bewertung" || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    // only one automatic reload per version – if the page is still old afterwards (server cache), show the button instead
    if (!busy && !this.shown && store.get("upd-tried") !== this.latest) { store.set("upd-tried", this.latest); this.reload(); return; }
    if (this.shown) return; this.shown = true;
    const b = document.createElement("div");
    b.className = "update-bar"; b.setAttribute("role", "status");
    b.innerHTML = `<span>Neue Tracky-Version verfügbar.</span><button class="btn sm primary" type="button">${I.refresh} Jetzt aktualisieren</button>`;
    b.querySelector("button").onclick = () => this.reload();
    document.body.append(b);
  },
  async reload(clear = false) {
    try {
      if (clear && "caches" in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
      await swReg?.update();
    } catch {}
    location.reload();
  },
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Updater.check(); });
if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) { const k = $("#kbd-hint"); if (k) k.textContent = "⌘ K"; }
$("#fab").onclick = quickDialog;
(async function boot() {
  PRIV = !!store.get("privacy", false);
  Lock.init();
  await loadData();
  go(); setLiveStatus();
  setTimeout(() => Updater.check(true), 1500);
  if (Sync.on()) { Sync.status("", "Sync wird geprüft …"); Sync.pull(); }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Sync.on()) Sync.pull(); });
  setInterval(() => { if (document.visibilityState === "visible" && Sync.on()) Sync.pull(); }, 2 * 60 * 1000);
  refreshQuotes(true);
  setInterval(() => { if (document.visibilityState === "visible") refreshQuotes(true); }, 5 * 60 * 1000);
})();
</script>
